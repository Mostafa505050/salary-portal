<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حافز - نسخة Supabase الاحترافية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.42.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap');
*{box-sizing:border-box; font-family:'Cairo',Tahoma}
body{
  background: #06110a;
  background-image: radial-gradient(800px 400px at 20% 10%, rgba(16,185,129,0.12), transparent 60%), radial-gradient(600px 400px at 90% 80%, rgba(5,95,70,0.18), transparent 60%);
  margin:0; padding:0; min-height:100vh;
}
.card{
  max-width:1120px; margin:24px auto;
  background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
  backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  border-radius:24px; padding:28px 26px;
  box-shadow: 0 25px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,0.15), 0 0 40px rgba(16,185,129,0.12);
  border:1px solid rgba(255,255,255,0.12);
}
h2{margin:0;font-size:26px;font-weight:800;color:#d1fae5;text-shadow:0 0 20px rgba(16,185,129,0.4)}
.badge{display:inline-flex;background:linear-gradient(180deg,rgba(16,185,129,0.2),rgba(5,150,105,0.2));border:1px solid rgba(52,211,153,0.3);padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;color:#6ee7b7}
.frame{background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(0,0,0,0.2));border:1px solid rgba(255,255,255,0.1);padding:20px;border-radius:20px;margin-top:16px}
.row1{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-start}
.code-col{width:90px;min-width:90px}.search-col{width:145px;min-width:145px;flex:1}.list-col{width:330px;min-width:200px;flex:2}.amount-col{width:115px;min-width:115px}.station-col{width:175px;min-width:175px}.arrow-col{width:52px;min-width:52px}
.row2{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.incentive-col{flex:1;min-width:220px;max-width:360px}
.small-col{width:78px;min-width:78px}.medium-col{width:115px;min-width:115px}.year-col{width:95px;min-width:95px}
.btns-col{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
select,input{
  width:100%; border:1.5px solid rgba(255,255,255,0.15); border-radius:13px; font-size:14px;
  background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.2)); color:#e2e8f0;
  box-shadow: 0 3px 0 rgba(0,0,0,0.3), 0 6px 14px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,0.1); transition:.15s
}
.row1 select,.row1 input{padding:12px 13px;height:48px}
.row2 select,.row2 input{height:44px!important;padding:9px 10px!important;font-size:13px!important}
select:focus,input:focus{outline:none;border-color:#10b981;transform:translateY(-1px)}
.label-box{height:48px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(16,185,129,0.25),rgba(5,150,105,0.4));border:1.5px solid rgba(16,185,129,0.4);border-radius:13px;font-weight:800;font-size:16px;color:#a7f3d0}
#numberSelect{background:linear-gradient(180deg,rgba(251,191,36,0.2),rgba(245,158,11,0.3))!important;border-color:rgba(251,191,36,0.4)!important;color:#fde68a!important}
#monthSelect{background:linear-gradient(180deg,rgba(56,189,248,0.2),rgba(14,165,233,0.3))!important;border-color:rgba(56,189,248,0.4)!important;color:#bae6fd!important}
#yearSelect{background:linear-gradient(180deg,rgba(52,211,153,0.2),rgba(16,185,129,0.3))!important;border-color:rgba(16,185,129,0.4)!important;color:#a7f3d0!important}
.btn-arrow{width:100%;height:48px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;background:linear-gradient(180deg,#818cf8,#4f46e5);border:1.5px solid #4338ca;border-radius:13px;color:#fff;cursor:pointer}
.btn{height:44px;padding:0 14px;border:none;border-radius:11px;font-weight:800;font-size:12.5px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.btn-add{background:linear-gradient(180deg,#38bdf8,#0ea5e9)}.btn-save{background:linear-gradient(180deg,#4ade80,#16a34a);color:#000}.btn-print{background:linear-gradient(180deg,#94a3b8,#475569)}.btn-send{background:linear-gradient(180deg,#fb7185,#e11d48)}.btn-clear{background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#000}
.preview-bar{margin-top:12px;padding:10px 14px;background:linear-gradient(180deg,rgba(16,185,129,0.15),rgba(5,150,105,0.2));border:1.5px solid rgba(16,185,129,0.3);border-radius:12px;font-size:13px;font-weight:800;color:#a7f3d0;text-align:center;display:none}
.table-wrap{max-width:950px;margin:24px auto 0 auto}
table{width:100%;border-collapse:separate;border-spacing:0;background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(0,0,0,0.2));backdrop-filter:blur(10px);border-radius:18px;overflow:hidden;border:1.5px solid rgba(255,255,255,0.12);table-layout:fixed}
th{background:linear-gradient(180deg,rgba(255,255,255,0.1),rgba(0,0,0,0.2));color:#d1fae5;padding:12px 6px;font-size:12px;font-weight:800;border-bottom:2px solid rgba(16,185,129,0.3)}
td{padding:8px 6px;border-top:1px solid rgba(255,255,255,0.06);font-size:12px;text-align:center;color:#e2e8f0}
.editable-input{width:75%!important;padding:6px!important;border-radius:9px!important;background:rgba(0,0,0,0.3)!important;color:#fff!important;border:1px solid rgba(16,185,129,0.3)!important}
.del-btn{background:linear-gradient(180deg,#fca5a5,#ef4444);color:#fff;border:none;padding:6px 11px;border-radius:10px;font-weight:800;cursor:pointer}
#loading{padding:20px;text-align:center;color:#6ee7b7}
</style>
</head>
<body>
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h2>إضافة حافز للموظفين - Supabase</h2><span class="badge" id="badge">⏳ جاري التحميل من Supabase...</span></div>

<div class="frame">
  <div class="row1">
    <div class="code-col"><div id="codeLabel" class="label-box">-</div></div>
    <div class="search-col"><input type="text" id="nameSearch" placeholder="جزء من الاسم" oninput="filterNames()" autocomplete="off"></div>
    <div class="list-col"><select id="filteredSelect" onchange="onSelectName()"><option>جاري تحميل الأسماء...</option></select></div>
    <div class="amount-col"><input type="number" id="amount" placeholder="مبلغ الحافز"></div>
    <div class="station-col"><select id="stationSelect"><option value="">المحطات</option></select></div>
    <div class="arrow-col"><button class="btn-arrow" onclick="fetchStationEmployees()" title="استدعاء موظفي المحطة">>></button></div>
  </div>

  <div class="row2">
    <div class="btns-col">
      <button class="btn btn-add" onclick="addToTable()">➕ Add</button>
      <button class="btn btn-save" onclick="saveLocal()">💾 Save</button>
      <button class="btn btn-print" onclick="printTable()">🖨 Print</button>
      <button class="btn btn-send" onclick="saveToSupabase()">☁️ حفظ في القاعدة</button>
      <button class="btn btn-clear" onclick="clearAll()">🧹 Clear</button>
    </div>
    <div class="incentive-col"><input type="text" id="incentiveName" placeholder="اسم الحافز - حافز إضافى نظير المجهودات" oninput="updatePreview()"></div>
    <div class="small-col"><select id="numberSelect" onchange="updatePreview()"></select></div>
    <div class="medium-col"><select id="monthSelect" onchange="updatePreview()"></select></div>
    <div class="year-col"><select id="yearSelect" onchange="updatePreview()"></select></div>
  </div>
  <div id="previewBar" class="preview-bar"></div>
</div>

<div class="table-wrap" id="printArea">
<table id="dataTable"><thead><tr>
<th style="width:55px" onclick="sortByM()">م <span id="arrowM">▲▼</span></th>
<th style="width:85px">كود العامل</th><th>اسم الموظف</th><th style="width:90px">مبلغ الحافز</th><th style="width:210px">المحطة</th><th style="width:60px">حذف</th>
</tr></thead><tbody id="tbody"></tbody></table>
</div>
<div id="saveResult" style="display:none;margin-top:14px;padding:12px;background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);border-radius:12px;color:#a7f3d0"></div>
</div>

<script>
const SUPABASE_URL="https://fmgtrtudpardxsvjbcve.supabase.co";
const SUPABASE_KEY="sb_publishable_w3Mdg-WdxcmXNk03fj45KA_Ol6MLulH";
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

var allEmployees=[], allStations=[], selectedEmp=null, tableData=[], sortAsc=true;

// ===== تحميل البيانات من Supabase =====
async function loadFromSupabase(){
  const {data, error}=await supa.from("employees_full").select("emp_code, emp_name, national_id, stations").limit(10000);
  if(error){ document.getElementById("badge").innerText="❌ خطأ: "+error.message; return; }
  allEmployees=data.map(r=>({code:r.emp_code||r.national_id?.slice(-6)||"-", name:r.emp_name, national_id:r.national_id, station:r.stations})).filter(e=>e.name);
  
  // استخراج المحطات الفريدة من عمود stations
  const stSet=new Set();
  data.forEach(r=>{
    if(r.stations){
      String(r.stations).split(/[,،\/\-\n]/).forEach(s=>{
        const t=s.trim(); if(t.length>=2 && t.length<40) stSet.add(t);
      });
    }
  });
  allStations=[...stSet].sort();
  
  document.getElementById("badge").innerText=`✅ ${allEmployees.length} موظف • ${allStations.length} محطة من Supabase`;
  loadAllNames();
  loadStations();
}

function loadAllNames(){
  var s=document.getElementById('filteredSelect');
  s.innerHTML=`<option value="">القائمة - ${allEmployees.length}</option>`;
  allEmployees.forEach(function(e){
    var o=document.createElement('option');
    o.value=e.code+'|||'+e.name+'|||'+(e.national_id||'');
    o.textContent=e.name+' - '+e.code;
    s.appendChild(o);
  });
  selectedEmp=null; document.getElementById('codeLabel').innerText='-';
}
function loadStations(){
  var st=document.getElementById('stationSelect');
  st.innerHTML='<option value="">المحطات</option>';
  allStations.forEach(function(x){
    var o=document.createElement('option'); o.value=x; o.textContent=x; st.appendChild(o);
  });
}
function loadNumbers(){var ns=document.getElementById('numberSelect');ns.innerHTML='';for(var i=1;i<=500;i++){var o=document.createElement('option');o.value=i;o.textContent=i;ns.appendChild(o);}}
function loadMonths(){var ms=document.getElementById('monthSelect');var months=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];ms.innerHTML='';months.forEach(function(m,idx){var o=document.createElement('option');o.value=m;o.textContent=m; if(idx===new Date().getMonth()) o.selected=true; ms.appendChild(o);});}
function loadYears(){var ys=document.getElementById('yearSelect');ys.innerHTML='';for(var y=2019;y<=2100;y++){var o=document.createElement('option');o.value=y;o.textContent=y; if(y===new Date().getFullYear()) o.selected=true; ys.appendChild(o);}}

function filterNames(){
  var q=document.getElementById('nameSearch').value.trim();
  var sel=document.getElementById('filteredSelect');
  selectedEmp=null; document.getElementById('codeLabel').innerText='-';
  if(q===''){loadAllNames();return;}
  sel.innerHTML='';
  var c=0;
  allEmployees.forEach(function(e){
    if(e.name.includes(q)){
      var o=document.createElement('option');
      o.value=e.code+'|||'+e.name+'|||'+(e.national_id||'');
      o.textContent=e.name+' - '+e.code;
      sel.appendChild(o);
      c++;
      if(c===1){selectedEmp={code:e.code,name:e.name,national_id:e.national_id,station:e.station};document.getElementById('codeLabel').innerText=e.code;}
    }
  });
}
function onSelectName(){
  var v=document.getElementById('filteredSelect').value;
  if(v.indexOf('|||')===-1){selectedEmp=null;document.getElementById('codeLabel').innerText='-';return;}
  var p=v.split('|||');
  selectedEmp={code:p[0],name:p[1],national_id:p[2]};
  document.getElementById('codeLabel').innerText=p[0];
}
function updatePreview(){
  var name=document.getElementById('incentiveName').value.trim();
  var num=document.getElementById('numberSelect').value;
  var month=document.getElementById('monthSelect').value;
  var year=document.getElementById('yearSelect').value;
  var bar=document.getElementById('previewBar');
  if(!name){bar.style.display='none';return;}
  var today=new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
  bar.style.display='block';
  bar.innerHTML='كشف رقم <b>'+num+'</b> - '+name+' - '+month+' '+year+' - <span style="color:#fde68a">إعتماد الصرف</span> - '+today;
}
function addToTable(){
  if(!selectedEmp){alert('اختار اسم');return;}
  var a=document.getElementById('amount').value||0;
  var st=document.getElementById('stationSelect').value||selectedEmp.station||'';
  var num=document.getElementById('numberSelect').value;
  // منع التكرار
  if(tableData.some(r=>r.code===selectedEmp.code)){alert('الموظف موجود بالفعل');return;}
  tableData.push({m:num,code:selectedEmp.code,name:selectedEmp.name,national_id:selectedEmp.national_id,amount:a,station:st});
  renderTable(); updatePreview();
}
function renderTable(){
  var tb=document.getElementById('tbody');
  tb.innerHTML='';
  tableData.forEach(function(r,i){
    tb.innerHTML+=`<tr>
      <td><input class="editable-input" value="${r.m}" onchange="tableData[${i}].m=this.value"></td>
      <td>${r.code}</td>
      <td style="text-align:right;padding-right:12px">${r.name}</td>
      <td><input class="editable-input" type="number" value="${r.amount}" onchange="tableData[${i}].amount=this.value"></td>
      <td style="white-space:normal;max-width:210px">${r.station}</td>
      <td><button class="del-btn" onclick="tableData.splice(${i},1);renderTable()">X</button></td>
    </tr>`;
  });
}
function sortByM(){sortAsc=!sortAsc;tableData.sort((a,b)=>sortAsc?(parseFloat(a.m)||0)-(parseFloat(b.m)||0):(parseFloat(b.m)||0)-(parseFloat(a.m)||0));document.getElementById('arrowM').textContent=sortAsc?'▲':'▼';renderTable();}
function clearAll(){if(!confirm('مسح الكل؟'))return;tableData=[];renderTable();document.getElementById('incentiveName').value='';document.getElementById('nameSearch').value='';document.getElementById('amount').value='';document.getElementById('codeLabel').innerText='-';selectedEmp=null;loadAllNames();document.getElementById('stationSelect').selectedIndex=0;document.getElementById('saveResult').style.display='none';document.getElementById('previewBar').style.display='none';}

function fetchStationEmployees(){
  var station=document.getElementById('stationSelect').value;
  if(!station){alert('اختار محطة اولا');return;}
  var amount=document.getElementById('amount').value||0;
  var startNum=parseInt(document.getElementById('numberSelect').value)||1;
  var list=allEmployees.filter(e=> (e.station||'').includes(station));
  if(list.length===0){ alert('لا يوجد موظفين بهذه المحطة في قاعدة employees_full'); return; }
  if(!confirm(`تم العثور على ${list.length} موظف في محطة ${station}. إضافتهم للجدول؟`)) return;
  tableData=[];
  list.forEach((e,idx)=>{
    tableData.push({m:startNum+idx, code:e.code, name:e.name, national_id:e.national_id, amount:amount, station:e.station||station});
  });
  renderTable();
  document.getElementById('saveResult').style.display='block';
  document.getElementById('saveResult').innerHTML=`✅ تم استدعاء <b>${list.length}</b> موظف لمحطة <b>${station}</b>`;
}

async function saveLocal(){
  var nm=document.getElementById('incentiveName').value.trim();if(!nm){alert('اكتب اسم الحافز');return;}if(!tableData.length){alert('الجدول فاضي');return;}
  var num=document.getElementById('numberSelect').value;var month=document.getElementById('monthSelect').value;var year=document.getElementById('yearSelect').value;var todayAr=new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
  var fullTitle='كشف رقم '+num+' - '+nm+' - '+month+' '+year+' - إعتماد الصرف - '+todayAr;
  var fileName=fullTitle.replace(/[\\/:*?"<>|]/g,"_")+".xls";
  var header=["م","كود العامل","اسم الموظف","مبلغ الحافز","المحطة"];var data=[header];tableData.forEach(function(r){data.push([r.m,r.code,r.name,r.amount,r.station]);});
  var wb=XLSX.utils.book_new();var ws=XLSX.utils.aoa_to_sheet(data);XLSX.utils.book_append_sheet(wb,ws,"الحافز");
  XLSX.writeFile(wb,fileName,{bookType:"biff8"});
  var d=document.getElementById('saveResult');d.style.display='block';d.innerHTML='✅ تم الحفظ محلياً: <b>'+fileName+'</b>';
}

async function saveToSupabase(){
  if(!tableData.length){alert('الجدول فاضي');return;}
  var nm=document.getElementById('incentiveName').value.trim();if(!nm){alert('اكتب اسم الحافز');return;}
  var num=document.getElementById('numberSelect').value;var month=document.getElementById('monthSelect').value;var year=document.getElementById('yearSelect').value;
  var todayAr=new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
  var fullTitle='كشف رقم '+num+' - '+nm+' - '+month+' '+year;
  
  const payload=tableData.map(r=>({
    incentive_number: parseInt(num),
    incentive_name: nm,
    month: month,
    year: parseInt(year),
    employee_code: r.code,
    employee_national_id: r.national_id,
    employee_name: r.name,
    amount: parseFloat(r.amount)||0,
    station: r.station,
    full_title: fullTitle
  }));
  
  document.getElementById('saveResult').style.display='block';
  document.getElementById('saveResult').innerHTML='⏳ جاري الحفظ في Supabase...';
  
  const {error}=await supa.from("incentives").insert(payload);
  if(error){
    document.getElementById('saveResult').innerHTML='❌ خطأ: '+error.message;
  }else{
    document.getElementById('saveResult').innerHTML=`✅ تم حفظ ${payload.length} حافز في قاعدة البيانات <b>incentives</b><br>العنوان: ${fullTitle}`;
  }
}

function printTable(){
  if(!tableData.length){alert('الجدول فاضي');return;}
  var nm=document.getElementById('incentiveName').value.trim()||'كشف حافز';var num=document.getElementById('numberSelect').value;var month=document.getElementById('monthSelect').value;var year=document.getElementById('yearSelect').value;var today=new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
  var fullTitle='كشف رقم '+num+' - '+nm+' - '+month+' '+year+' - إعتماد الصرف - '+today;
  var printHTML=document.getElementById('printArea').innerHTML;
  var win=window.open('','','width=1100,height=800');
  win.document.write(`<html dir="rtl"><head><title>${fullTitle}</title><style>body{font-family:Tahoma;padding:12mm}h2{text-align:center}table{width:100%;border-collapse:collapse}th,td{border:1.8px solid #000;padding:8px;text-align:center}th{background:#efefef}td:last-child,th:last-child{display:none}</style></head><body><h2>${fullTitle}</h2>${printHTML}<script>setTimeout(()=>window.print(),600)<\/script></body></html>`);
  win.document.close();
}

window.addEventListener('load',function(){loadFromSupabase();loadNumbers();loadMonths();loadYears();});
</script>
</body>
</html>
