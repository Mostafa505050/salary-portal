<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدخول الذكي - رقم البطاقة والبصمة - موجه من توجيه_المستخدمين</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif}
body{background:#020a05;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(900px 500px at 50% 0%, rgba(16,185,129,0.18), transparent 70%), radial-gradient(600px 400px at 0% 100%, rgba(5,150,105,0.12), transparent), #020a05}
.card{width:100%;max-width:480px;backdrop-filter:blur(28px);background:linear-gradient(180deg,rgba(255,255,255,0.11),rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.10);border-radius:24px;box-shadow:0 40px 100px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,0.1);padding:28px;animation:enter .5s ease}
@keyframes enter{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}
.input{width:100%;height:54px;background:rgba(0,0,0,0.5);border:1.5px solid rgba(255,255,255,0.10);border-radius:14px;padding:0 16px;color:#e2e8f0;outline:none;font-size:15px;transition:.2s}
.input:focus{border-color:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,0.15)}
.btn{width:100%;height:54px;border-radius:14px;font-weight:800;cursor:pointer;border:none;transition:.15s;font-size:14px}
.btn-primary{background:linear-gradient(180deg,#10b981,#059669);color:#000;box-shadow:0 6px 0 #047857, 0 12px 24px rgba(16,185,129,0.25)}
.btn-primary:active{transform:translateY(4px);box-shadow:0 2px 0 #047857}
.btn-ghost{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#a7f3d0}
.msg{border-radius:14px;padding:12px 14px;font-size:11.5px;border:1px solid;margin-top:12px;white-space:pre-wrap;line-height:1.7}
.msg-error{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.25);color:#fecaca}
.msg-success{background:rgba(16,185,129,0.14);border-color:rgba(16,185,129,0.3);color:#a7f3d0}
.msg-warn{background:rgba(245,158,11,0.14);border-color:rgba(245,158,11,0.3);color:#fde68a}
.badge{font-size:9px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.45)}
/* اسم المستخدم ثلاثي الابعاد مبهر */
.welcome-3d{
  background: linear-gradient(145deg, rgba(16,185,129,0.18), rgba(139,92,246,0.12));
  border:1px solid rgba(16,185,129,0.22);
  border-right:4px solid #10b981;
  border-bottom:4px solid rgba(16,185,129,0.18);
  border-radius:16px;
  padding:14px;
  transform-style:preserve-3d;
  box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 16px 32px rgba(0,0,0,0.3), 0 0 0 1px rgba(16,185,129,0.1) inset;
  transition:.4s;
  position:relative;
  overflow:hidden;
}
.welcome-3d::before{
  content:'';position:absolute;inset:0;
  background: radial-gradient(400px 200px at 50% 0%, rgba(16,185,129,0.15), transparent 60%);
  pointer-events:none;
}
.welcome-3d:hover{transform:translateY(-3px) rotateX(3deg) rotateY(-3deg) translateZ(10px); box-shadow: 0 12px 0 rgba(0,0,0,0.25), 0 24px 48px rgba(0,0,0,0.35);}
.welcome-name{
  font-size:15px;font-weight:900;color:#ecfdf5;
  text-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 20px rgba(16,185,129,0.4);
  transform:translateZ(15px);
  line-height:1.4;
}
.welcome-role{
  font-size:11px;font-weight:700;color:#6ee7b7;
  margin-top:4px;transform:translateZ(10px);
}
</style>
</head>
<body>
<div class="card">
  <div class="text-center mb-6">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-700 flex items-center justify-center text-2xl shadow-xl shadow-emerald-900/40">🪪</div>
    <h1 class="text-[19px] font-black text-white mt-3 tracking-tight">الدخول الذكي برقم البطاقة</h1>
    <p class="text-[11px] text-white/40 mt-1">الرقم القومي (14 رقم) + البصمة / النقش - موجه من جدول توجيه_المستخدمين</p>
  </div>

  <!-- STEP 1 -->
  <div id="step1">
    <label class="text-[11px] font-bold text-emerald-200/70 mb-2 block">رقم البطاقة القومي</label>
    <input id="cardNumber" class="input" inputmode="numeric" maxlength="14" placeholder="**************" value="">
    <button onclick="checkByCard()" id="btnCheck" class="btn btn-primary mt-4">🔍 فحص برقم البطاقة</button>
    <div id="msg1"></div>
  </div>

  <!-- STEP REGISTER -->
  <div id="stepReg" class="hidden">
    <div id="welcomeReg" class="welcome-3d">
      <div id="welcomeRegName" class="welcome-name"></div>
      <div id="welcomeRegRole" class="welcome-role"></div>
      <div style="font-size:9px;color:rgba(255,255,255,0.35);margin-top:6px">البصمة فارغة - سجل أول مرة (مرة واحدة فقط) - تحفظ في حقل بصمة بجدول موظفين_مرتبات</div>
    </div>
    <div class="mt-4 space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-[10px] text-white/40">الاسم</label><input id="empName" class="input" disabled></div>
        <div><label class="text-[10px] text-white/40">الكود البنكي = emptid</label><input id="empCode" class="input" disabled></div>
      </div>
      <input id="newPass" class="input" type="password" placeholder="كلمة مرور جديدة">
      <input id="confirmPass" class="input" type="password" placeholder="تأكيد كلمة المرور">
      <select id="bioType" class="input">
        <option value="pattern">🔷 نقش (أسرع - مثال 1,2,3,6,9)</option>
        <option value="fingerprint">👆 بصمة إصبع الجهاز</option>
        <option value="face">🙂 بصمة وجه الجهاز</option>
      </select>
      <input id="patternVal" class="input" placeholder="قيمة النقش" value="1,2,3,6,9">
      <button onclick="registerByCard()" id="btnReg" class="btn btn-primary">💾 تسجيل البصمة لأول مرة</button>
      <p class="text-[9px] text-white/25 text-center">يتم حفظ البصمة في عمود (بصمة) مرة واحدة في موظفين_مرتبات</p>
    </div>
    <div id="msgReg"></div>
  </div>

  <!-- STEP LOGIN -->
  <div id="stepLogin" class="hidden">
    <div id="welcomeLogin" class="welcome-3d">
      <div id="welcomeLoginName" class="welcome-name"></div>
      <div id="welcomeLoginRole" class="welcome-role"></div>
      <div style="font-size:9px;color:rgba(255,255,255,0.35);margin-top:6px">تم العثور على بصمة محفوظة - سيتم مقارنتها</div>
    </div>

    <div class="mt-4 space-y-3">
      <button onclick="loginWithBio()" class="btn btn-primary">🔓 دخول بالبصمة / النقش</button>
      <div class="flex gap-2">
        <input id="loginPass" class="input flex-1" type="password" placeholder="كلمة المرور">
        <button onclick="loginWithPass()" class="px-5 h-[54px] rounded-xl bg-white/5 border border-white/10 text-[12px] text-emerald-200">دخول</button>
      </div>
    </div>
    <div id="msgLogin"></div>
  </div>

  <div class="mt-6 flex gap-2">
    <button onclick="location.reload()" class="flex-1 h-9 rounded-xl bg-white/5 border border-white/10 text-[11px] text-white/40">🔄 إعادة</button>
    <button onclick="localStorage.clear(); location.reload()" class="flex-1 h-9 rounded-xl bg-red-500/10 border border-red-500/20 text-[11px] text-red-300">🚪 خروج</button>
  </div>
</div>

<script>
const API_BASE = "https://turso-api.mostafa-voic77729.workers.dev";
let currentUser=null;
let currentRouting=null;

function showMsg(id, text, type='error'){
  const el=document.getElementById(id);
  if(!text){ el.innerHTML=''; return; }
  const cls=type==='error'?'msg-error':type==='success'?'msg-success':'msg-warn';
  el.innerHTML=`<div class="msg ${cls}">${text}</div>`;
}

// جلب توجيه المستخدم من جدول توجيه_المستخدمين حسب الرقم القومي أو الكود البنكي
async function getRoutingFromTable(nationalId, code){
  try{
    const sql = `SELECT * FROM "توجيه_المستخدمين" WHERE ("الرقم_القومى"='${String(nationalId).replace(/'/g,"''")}' OR "الكود_البنكى"='${String(code).replace(/'/g,"''")}') AND "مفعلة"=1 LIMIT 1`;
    const res = await fetch(API_BASE+'/api/turso',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({sql})});
    const j = await res.json();
    if(j.ok && j.rows && j.rows.length){
      const r = j.rows[0];
      // تحقق تاريخ الانتهاء
      if(r["تاريخ_الانتهاء"]){
        const end = new Date(r["تاريخ_الانتهاء"]);
        if(new Date() > end){
          console.log('انتهت صلاحية التوجيه');
          return null;
        }
      }
      return r;
    }
  }catch(e){ console.error('خطأ جلب التوجيه', e); }
  return null;
}

function getRedirectFromRouting(routing, fallbackRole){
  if(routing && routing["الصفحة_الافتراضية"]){
    return routing["الصفحة_الافتراضية"];
  }
  // fallback حسب الصلاحية
  const role = (fallbackRole||'').toLowerCase();
  if(role.includes('admin')) return 'pageAdmin1';
  return 'pageUser1';
}

async function checkByCard(){
  const card=document.getElementById('cardNumber').value.trim();
  if(!/^\d{14}$/.test(card)){ showMsg('msg1','رقم البطاقة يجب أن يكون 14 رقم','error'); return; }
  const btn=document.getElementById('btnCheck'); btn.textContent='⏳ يفحص في قاعدة البيانات...'; btn.disabled=true; showMsg('msg1','');
  try{
    const res=await fetch(API_BASE+'/api/check-by-card',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({cardNumber:card})});
    const data=await res.json();
    if(!data.ok){ showMsg('msg1','❌ '+data.msg,'error'); return; }
    currentUser=data.user;
    const name=currentUser['اسم_العمل']||currentUser['اسم_العامل']||currentUser['الاسم']||'مستخدم';
    const code=currentUser['الكود_البنكى']||currentUser['الكود_البنكي']||'--';
    const bio=currentUser['بصمة'];
    const role=currentUser['الصلاحيات']||currentUser['نوع_المستخدم']||'User';
    const isEmpty=!bio || String(bio).trim()==='' || String(bio).toLowerCase()==='null';

    // جلب التوجيه من جدول توجيه_المستخدمين
    currentRouting = await getRoutingFromTable(card, code);

    if(isEmpty){
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('stepReg').classList.remove('hidden');
      document.getElementById('empName').value=name;
      document.getElementById('empCode').value=code;
      document.getElementById('welcomeRegName').textContent=`مرحبا ${name}`;
      document.getElementById('welcomeRegRole').textContent=`الصلاحية ${role} - الكود ${code} - التوجيه: ${currentRouting ? currentRouting["الصفحة_الافتراضية"] : 'افتراضي'}`;
    }else{
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('stepLogin').classList.remove('hidden');
      // ثلاثي الأبعاد مبهر
      document.getElementById('welcomeLoginName').textContent=`مرحبا ${name}`;
      document.getElementById('welcomeLoginRole').textContent=`الصلاحية ${role} - مثال: مصطفى درويش سيد درويش - الصلاحية ${role}`;
      if(currentRouting){
        document.getElementById('welcomeLoginRole').textContent=`مرحبا ${name} - الصلاحية ${currentRouting["الصلاحية"]||role} - التوجيه من جدول توجيه_المستخدمين`;
      }
    }
  }catch(e){ showMsg('msg1','خطأ اتصال: '+e.message,'error'); }
  finally{ btn.textContent='🔍 فحص برقم البطاقة'; btn.disabled=false; }
}

async function registerByCard(){
  const newPass=document.getElementById('newPass').value.trim();
  const confirm=document.getElementById('confirmPass').value.trim();
  const bioType=document.getElementById('bioType').value;
  let bioVal=document.getElementById('patternVal').value.trim()||'1,2,3,6,9';
  if(newPass.length<3){ showMsg('msgReg','كلمة المرور قصيرة','error'); return; }
  if(newPass!==confirm){ showMsg('msgReg','كلمتا المرور غير متطابقتين','error'); return; }
  let bioJson;
  if(bioType==='fingerprint'||bioType==='face'){
    try{
      const challenge=new Uint8Array(32); crypto.getRandomValues(challenge);
      const cred=await navigator.credentials.create({publicKey:{challenge, rp:{name:"شئون العاملين"}, user:{id:new TextEncoder().encode(String(currentUser['الرقم_القومى'])), name:currentUser['اسم_العمل']||'user', displayName:currentUser['اسم_العمل']||'user'}, pubKeyCredParams:[{alg:-7,type:"public-key"}], authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"}, timeout:60000}});
      const credId=btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
      bioJson=JSON.stringify({type:bioType, credId, created:Date.now()});
    }catch(err){ showMsg('msgReg','فشل بصمة الجهاز: '+err.message+' - استخدم النقش','error'); return; }
  }else{ bioJson=JSON.stringify({type:'pattern', value:bioVal, created:Date.now()}); }
  const btn=document.getElementById('btnReg'); btn.textContent='⏳ يحفظ البصمة في حقل بصمة...'; btn.disabled=true;
  try{
    const res=await fetch(API_BASE+'/api/register-by-card',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({cardNumber:String(currentUser['الرقم_القومى']), bio:bioJson, password:newPass})});
    const data=await res.json(); if(!data.ok) throw new Error(data.msg);
    showMsg('msgReg','✅ تم حفظ البصمة بنجاح في حقل بصمة بجدول موظفين_مرتبات! سيتم إعادة التحميل...','success');
    setTimeout(()=> location.reload(), 1500);
  }catch(e){ showMsg('msgReg','فشل: '+e.message,'error'); }
  finally{ btn.textContent='💾 تسجيل البصمة لأول مرة'; btn.disabled=false; }
}

async function loginWithBio(){
  try{
    const bio=currentUser['بصمة']; 
    if(!bio){ showMsg('msgLogin','لا توجد بصمة محفوظة - سجل أولاً','error'); return; }
    const saved=JSON.parse(bio);
    if(saved.type==='pattern'){
      const input=prompt(`أدخل النقش المحفوظ لمقارنته:`); if(!input) return;
      // مقارنة محلية أولا
      if(input.trim() !== saved.value){
        showMsg('msgLogin','❌ النقش غير مطابق - حاول مرة أخرى','error');
        return;
      }
      const res=await fetch(API_BASE+'/api/bio-login-by-card',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({cardNumber:String(currentUser['الرقم_القومى']), bioAttempt:input.trim()})});
      const data=await res.json(); if(!data.ok) throw new Error(data.msg); await doRedirect(data);
    }else{
      const challenge=new Uint8Array(32); crypto.getRandomValues(challenge);
      const credIdBytes=Uint8Array.from(atob(saved.credId), c=>c.charCodeAt(0));
      await navigator.credentials.get({publicKey:{challenge, allowCredentials:[{id:credIdBytes, type:'public-key'}], userVerification:"required", timeout:60000}});
      const res=await fetch(API_BASE+'/api/bio-login-by-card',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({cardNumber:String(currentUser['الرقم_القومى'])})});
      const data=await res.json(); if(!data.ok) throw new Error(data.msg); await doRedirect(data);
    }
  }catch(e){ showMsg('msgLogin','فشل البصمة: '+e.message,'error'); }
}

async function loginWithPass(){
  const pass=document.getElementById('loginPass').value.trim();
  // ❌ تم إلغاء عرض كلمة المرور الصحيحة - رسالة عامة فقط
  if(String(currentUser['كلمة_المرور']).trim()!==pass){ 
    showMsg('msgLogin',`❌ كلمة المرور غير صحيحة - حاول مرة أخرى`,'error'); 
    return; 
  }
  // جلب التوجيه من جدول توجيه_المستخدمين حسب الرقم القومي أو الكود البنكي
  if(!currentRouting){
    currentRouting = await getRoutingFromTable(String(currentUser['الرقم_القومى']), String(currentUser['الكود_البنكى']||''));
  }
  const role=currentUser['الصلاحيات']||currentUser['نوع_المستخدم']||'User';
  const redirectPage = getRedirectFromRouting(currentRouting, role);
  
  localStorage.setItem('secure_token','card_'+Date.now()+'_'+currentUser['الرقم_القومى']);
  const loggedData = {
    card:currentUser['الرقم_القومى'], 
    cardNumber:currentUser['الرقم_القومى'],
    code:currentUser['الكود_البنكى'], 
    "الكود_البنكى":currentUser['الكود_البنكى'],
    emptid:currentUser['الكود_البنكى'],
    name:currentUser['اسم_العمل']||currentUser['اسم_العامل'], 
    "اسم_العامل":currentUser['اسم_العمل']||currentUser['اسم_العامل'],
    role: currentRouting ? currentRouting["الصلاحية"] : role,
    defaultPage: redirectPage,
    routing: currentRouting
  };
  localStorage.setItem('logged_user',JSON.stringify(loggedData));
  
  // ✅ ضيف دول هنا - السطرين المطلوبين - قبل التوجيه
  localStorage.setItem('entry_via_index', String(Date.now()));
  if(window.markEntryViaIndex) window.markEntryViaIndex();

  showMsg('msgLogin',`✅ صحيح - مرحبا ${loggedData.name} - الصلاحية ${loggedData.role} - ينتقل إلى ${redirectPage}...`,'success');
  setTimeout(()=>{ location.href=redirectPage; },800);
}
async function doRedirect(apiData){
  const role=apiData.role || currentUser['الصلاحيات']||'User';
  // جلب التوجيه من جدول توجيه_المستخدمين
  if(!currentRouting){
    currentRouting = await getRoutingFromTable(String(currentUser['الرقم_القومى']), String(currentUser['الكود_البنكى']||''));
  }
  const redirectPage = getRedirectFromRouting(currentRouting, role);
  
  localStorage.setItem('secure_token',apiData.token);
  const loggedData = {
    card:currentUser['الرقم_القومى'],
    cardNumber:currentUser['الرقم_القومى'],
    code:currentUser['الكود_البنكى'],
    "الكود_البنكى":currentUser['الكود_البنكى'],
    emptid:currentUser['الكود_البنكى'],
    name:currentUser['اسم_العمل']||currentUser['اسم_العامل'],
    "اسم_العامل":currentUser['اسم_العمل']||currentUser['اسم_العامل'],
    role: currentRouting ? currentRouting["الصلاحية"] : role,
    defaultPage: redirectPage,
    routing: currentRouting
  };
  localStorage.setItem('logged_user',JSON.stringify(loggedData));
  localStorage.setItem('entry_via_index', String(Date.now()));
if(window.markEntryViaIndex) window.markEntryViaIndex();
  showMsg('msgLogin',`✅ تم التحقق بالبصمة - مرحبا ${loggedData.name} - الصلاحية ${loggedData.role} - ينتقل إلى ${redirectPage}...`,'success');
  setTimeout(()=>{ location.href=redirectPage; },800);
}
</script>
</body>
</html>
