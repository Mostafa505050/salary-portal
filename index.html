<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام مفردات المرتبات - دخول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{margin:0;min-height:100vh;background:#040a08;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bg-glow{position:absolute;inset:0;pointer-events:none}
.bg-glow::before{content:"";position:absolute;top:-30%;right:-20%;width:80%;height:80%;border-radius:50%;background:radial-gradient(circle at center,rgba(16,185,129,0.18),transparent 65%);filter:blur(10px)}
.bg-glow::after{content:"";position:absolute;bottom:-30%;left:-25%;width:90%;height:90%;border-radius:50%;background:radial-gradient(circle at center,rgba(212,175,55,0.12),transparent 60%);filter:blur(12px)}
.card{position:relative;width:100%;max-width:420px;margin:16px;background:linear-gradient(135deg,rgba(13,31,23,.9),rgba(7,15,11,.9));border:1px solid rgba(255,255,255,.1);border-radius:28px;backdrop-filter:blur(28px);padding:32px;box-shadow:0 20px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);z-index:10}
.logo{width:72px;height:72px;margin:0 auto 16px;border-radius:18px;background:linear-gradient(135deg,#102a1d,#06110a);border:1px solid rgba(52,211,153,.25);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.input-group{margin-bottom:20px}
.label{font-size:12px;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:8px;display:block}
.input-wrap{position:relative;background:#050c08;border:1px solid rgba(255,255,255,.08);border-radius:14px;transition:.2s}
.input-wrap:focus-within{border-color:rgba(52,211,153,.3);box-shadow:0 0 0 3px rgba(16,185,129,.12)}
.input-wrap input{width:100%;height:52px;background:transparent;border:0;padding:0 16px 0 48px;color:#fff;font-weight:700;outline:none;letter-spacing:.1em}
.btn{width:100%;height:56px;border:0;border-radius:16px;background:linear-gradient(135deg,#34d399,#059669);color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 16px rgba(16,185,129,.3);transition:.2s}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn:hover{transform:translateY(-1px)}
.msg{margin-top:16px;min-height:20px;text-align:center;font-size:13px;padding:8px;border-radius:12px;display:none}
.msg.show{display:block}
.msg.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fca5a5}
.msg.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);color:#6ee7b7}
.result{margin-top:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:16px;display:none}
.result.show{display:block}
.row{display:flex;justify-content:space-between;margin:8px 0;font-size:14px}
.row b{color:#6ee7b7}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="card">
  <div class="logo">💰</div>
  <h1 style="text-align:center;margin:0;font-size:22px;font-weight:800">نظام مفردات المرتبات</h1>
  <p style="text-align:center;color:rgba(167,243,208,.8);font-size:13px;margin:4px 0 24px">شركة مصر الوسطى لنقل الكهرباء - بني سويف</p>

  <div class="input-group">
    <label class="label">الرقم القومي (14 رقم)</label>
    <div class="input-wrap">
      <input id="nid" maxlength="14" inputmode="numeric" placeholder="29901010101010" dir="ltr">
    </div>
  </div>
  <div class="input-group">
    <label class="label">كلمة المرور</label>
    <div class="input-wrap">
      <input id="pass" type="password" placeholder="••••••" dir="ltr">
    </div>
  </div>

  <button id="btn" class="btn" onclick="doLogin()">دخول آمن للنظام</button>
  <div id="msg" class="msg"></div>

  <div id="result" class="result">
    <div class="row"><span>الاسم:</span><b id="r_name">-</b></div>
    <div class="row"><span>كود الموظف:</span><b id="r_code">-</b></div>
    <div class="row"><span>المرتب:</span><b id="r_salary">-</b></div>
    <div class="row"><span>الحافز:</span><b id="r_inc">-</b></div>
    <div class="row" style="border-top:1px solid rgba(255,255,255,.1);padding-top:8px;margin-top:8px"><span>الإجمالي:</span><b id="r_total" style="color:#fde68a">-</b></div>
  </div>

  <div style="text-align:center;margin-top:20px;font-size:11px;color:rgba(255,255,255,.3)">🔒 اتصال مشفر - يستحمل 500 موظف في نفس الوقت</div>
</div>

<script>
// === إعداداتك ===
const SUPABASE_URL = "https://fmgtrtudpardxsvjbcve.supabase.co";
const SUPABASE_KEY = "sb_publishable_w3Mdg-WdxcmXNk03fj45KA_Ol6MLulH";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function toEng(str){
  const map={"٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9"};
  return String(str).replace(/[٠-٩]/g, c=>map[c]).replace(/\s+/g,"").trim();
}

function showMsg(text, type){
  const el=document.getElementById("msg");
  el.textContent=text;
  el.className="msg show "+(type==="err"?"err":"ok");
}

async function doLogin(){
  const nidEl=document.getElementById("nid");
  const passEl=document.getElementById("pass");
  const btn=document.getElementById("btn");
  const result=document.getElementById("result");

  const nid=toEng(nidEl.value);
  const pass=passEl.value.trim();

  if(nid.length!==14){ showMsg("الرقم القومي يجب أن يكون 14 رقمًا","err"); return; }
  if(!pass){ showMsg("ادخل كلمة المرور","err"); return; }

  btn.disabled=true; btn.textContent="جاري التحقق..."; result.classList.remove("show");
  showMsg("","ok");

  try{
    const { data, error } = await supabaseClient
      .from("employees")
      .select("*")
      .eq("national_id", nid)
      .eq("password", pass)
      .single();

    if(error || !data){
      showMsg("الرقم القومي أو كلمة المرور غير صحيحة","err");
      btn.disabled=false; btn.textContent="دخول آمن للنظام";
      return;
    }

    showMsg(`مرحباً ${data.emp_name} - تم تسجيل الدخول بنجاح`,"ok");
    document.getElementById("r_name").textContent=data.emp_name;
    document.getElementById("r_code").textContent=data.emp_code;
    document.getElementById("r_salary").textContent=(data.salary||0)+" جنيه";
    document.getElementById("r_inc").textContent=(data.incentive||0)+" جنيه";
    document.getElementById("r_total").textContent=((parseFloat(data.salary||0)+parseFloat(data.incentive||0)))+" جنيه";
    result.classList.add("show");

  }catch(e){
    console.error(e);
    showMsg("خطأ في الاتصال: "+e.message,"err");
  }
  btn.disabled=false; btn.textContent="دخول آمن للنظام";
}
</script>
</body>
</html>
