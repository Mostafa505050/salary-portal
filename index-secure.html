<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيان الراتب - بيانات حقيقية من Turso</title>

<!-- Security Headers - حماية سيبرانية -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://turso-api.mostafa-voic77729.workers.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">

<script src="./js/auth-guard.js"></script>

<link rel="stylesheet" href="./styles/variables.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/PageAll.css">

<!-- html2canvas مع SRI - حماية من تسمم المكتبات -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaRQnYJYiPSqLHsaCYGWc4R0BU6LEB3n1VWQkZ6A3fWvZb1q4e1s0U5s1g5a6s7d8f9g0h1j2k3l4m5n6o7p8q9r0s1t2u3v==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body data-page="pageUser1"> 

<button id="themeToggle" class="no-print" title="تغيير المظهر">🌙</button>

<div class="max-w-4xl mx-auto">

  <!-- top-strip - آمن - لا innerHTML -->
  <div class="card top-strip no-print">
    <div>
      <h1 id="userName">مرحبا User</h1>
      <p>تم الدخول برقم البطاقة والبصمة - بيانات حقيقية من Turso</p>
    </div>
    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <button class="code-badge" data-action="download">📷 تحميل </button>
      <button class="code-badge" data-action="print">🖨 طباعة</button>
      <span id="headerCode" class="code-badge">الكود: --</span>
      <button data-action="logout" class="code-badge">خروج</button>
    </div>
  </div>

  <!-- nav-strip -->
  <div class="card nav-strip no-print">
    <button class="code-badge" data-action="prev"><< السابق</button>
    <div class="month-center">
      <div id="currentMonthLabel" class="label-month">--</div>
      <div id="currentYearLabel" class="label-year">--</div>
    </div>
    <button class="code-badge" data-action="next">التالي >></button>
  </div>

  <div id="loader" class="card loader no-print">⏳ جاري تحميل بيانات الراتب من قاعدة البيانات Turso... <span id="loadCounter">0 ث</span></div>

  <div id="displayArea" class="displayArea" style="display:none;">
    <div id="printArea" class="printArea-real"></div>
  </div>

</div>

<!-- قائمة موبايل - آمنة بـ data-action -->
<div id="mobileBottomMenu" class="no-print">
  <button class="mob-btn" data-action="prev">
    <span class="mob-icon">⏮</span>
    <span class="mob-label">السابق</span>
  </button>
  <button class="mob-btn" data-action="next">
    <span class="mob-icon">⏭</span>
    <span class="mob-label">التالي</span>
  </button>
  <button class="mob-btn" data-action="print">
    <span class="mob-icon">🖨</span>
    <span class="mob-label">طباعة</span>
  </button>
  <button class="mob-btn" data-action="download">
    <span class="mob-icon">📷</span>
    <span class="mob-label">صورة</span>
  </button>
  <button class="mob-btn" data-action="logout">
    <span class="mob-icon">🚪</span>
    <span class="mob-label">خروج</span>
  </button>
</div>

<!-- تحميل الملفات المفصولة كـ ES Modules مؤمنة -->
<script type="module" src="./js/main.js"></script>

</body>
</html>
