<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم الأدمن - رفع بيانات الموظفين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{background:#f5f7fb;margin:0;padding:20px}
.container{max-width:900px;margin:auto}
.card{background:white;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.07);margin-bottom:20px;border-top:6px solid #d93025}
h2{color:#b91c1c;margin:0 0 10px;font-weight:800}
.btn{background:linear-gradient(to bottom,#d93025,#a71d1d);color:white;border:none;padding:14px 28px;border-radius:10px;font-weight:800;cursor:pointer;font-size:16px;box-shadow:0 5px 0 #7f0000}
.btn:active{transform:translateY(5px);box-shadow:none}
.btn:disabled{opacity:0.5}
input[type=file]{padding:10px;border:2px dashed #ddd;border-radius:10px;width:100%;margin:15px 0}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}
th{background:#f3f4f6;padding:8px;border:1px solid #e5e7eb}
td{padding:6px;border:1px solid #e5e7eb}
#log{background:#111;color:#0f0;padding:12px;border-radius:8px;max-height:250px;overflow:auto;font-family:monospace;font-size:12px;margin-top:15px;white-space:pre-wrap}
.success{color:#0f9d58;font-weight:800}
.error{color:#d93025}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>📤 لوحة رفع بيانات الموظفين (Excel)</h2>
    <p style="color:#666">ارفع نفس ملف DATAFILE اللي في الصورة. النظام هيقرا الأعمدة: الرقم القومي - كود الفعل - اسم العامل - رقم ملف - password - role</p>
    <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
    <button class="btn" id="uploadBtn" onclick="handleUpload()">🚀 رفع البيانات لـ Supabase</button>
    <div id="preview"></div>
    <div id="log"></div>
  </div>
  <div class="card">
    <h2>📊 حالة قاعدة البيانات</h2>
    <p>عدد الموظفين الحالي: <b id="count">--</b></p>
    <button onclick="checkCount()" style="padding:8px 16px;border-radius:8px;border:1px solid #ddd;cursor:pointer">تحديث العدد</button>
    <button onclick="clearAll()" style="padding:8px 16px;border-radius:8px;border:1px solid #d93025;color:#d93025;cursor:pointer;margin-right:10px">🗑️ مسح الكل</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://fmgtrtudpardxsvjbcve.supabase.co";
const SUPABASE_KEY = "sb_publishable_w3Mdg-WdxcmXNk03fj45KA_Ol6MLulH";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let parsedData = [];

function log(msg, cls=""){
  const el=document.getElementById("log");
  el.innerHTML += `<div class="${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function checkCount(){
  const {count} = await supabaseClient.from("employees").select("*",{count:"exact",head:true});
  document.getElementById("count").innerText = count ?? 0;
}
checkCount();

document.getElementById("excelFile").addEventListener("change", function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    const data = new Uint8Array(evt.target.result);
    const wb = XLSX.read(data,{type:"array"});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet,{header:1});
    // json[0] هو الهيدر
    // نفترض الترتيب: الرقم القومي, كود الفعل, اسم العامل رباعي, رقم ملف, ملاحظات, تاريخ التعديل, password, role
    parsedData = [];
    for(let i=1;i<json.length;i++){
      const row = json[i];
      if(!row[0]) continue;
      parsedData.push({
        national_id: String(row[0]).trim(),
        emp_code: row[1] ? String(row[1]).trim() : "",
        emp_name: row[2] ? String(row[2]).trim() : "",
        file_number: row[3] ? String(row[3]).trim() : "",
        notes: row[4] ? String(row[4]).trim() : "",
        updated_at: row[5] ? String(row[5]) : "",
        password: row[6] ? String(row[6]).trim() : String(row[0]).slice(-4), // لو فاضي ناخد اخر 4 ارقام من القومي
        role: row[7] ? String(row[7]).trim() : "employee",
        whatsapp: ""
      });
    }
    log(`✅ تم قراءة ${parsedData.length} موظف من الملف`, "success");
    let html = `<table><tr><th>الرقم القومي</th><th>الكود</th><th>الاسم</th><th>password</th></tr>`;
    parsedData.slice(0,10).forEach(r=>{
      html+=`<tr><td>${r.national_id}</td><td>${r.emp_code}</td><td>${r.emp_name}</td><td>${r.password}</td></tr>`;
    });
    html+=`</table><small>... و ${Math.max(0,parsedData.length-10)} آخرين</small>`;
    document.getElementById("preview").innerHTML = html;
  };
  reader.readAsArrayBuffer(file);
});

async function handleUpload(){
  if(parsedData.length==0){alert("اختر الملف الاول");return;}
  const btn=document.getElementById("uploadBtn");
  btn.disabled=true; btn.innerText="جاري الرفع...";
  log(`⏳ بدء رفع ${parsedData.length} موظف...`);
  
  // رفع على دفعات 100 كل مرة عشان Supabase
  const chunkSize=100;
  let success=0, failed=0;
  for(let i=0;i<parsedData.length;i+=chunkSize){
    const chunk = parsedData.slice(i,i+chunkSize);
    const {error} = await supabaseClient.from("employees").upsert(chunk,{onConflict:"national_id"});
    if(error){
      log(`❌ خطأ في الدفعة ${i/chunkSize+1}: ${error.message}`, "error");
      failed+=chunk.length;
    }else{
      success+=chunk.length;
      log(`✅ تم رفع ${success}/${parsedData.length}`, "success");
    }
  }
  log(`\n🎉 انتهى! نجح: ${success} - فشل: ${failed}`, success>0?"success":"error");
  btn.disabled=false; btn.innerText="🚀 رفع البيانات لـ Supabase";
  checkCount();
}

async function clearAll(){
  if(!confirm("متأكد عايز تمسح كل الموظفين؟")) return;
  const {error} = await supabaseClient.from("employees").delete().neq("national_id","__never__");
  if(error) alert(error.message); else {log("🗑️ تم مسح الكل","error"); checkCount();}
}
</script>
</body>
</html>
