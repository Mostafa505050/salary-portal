async function loadEmployees(){
  const {data,error}=await supa.from("employees_full").select("emp_code, emp_name, national_id").limit(10000);
  if(error){ document.getElementById("countInfo").innerText="❌ خطأ"; return; }
  uniqueEmployees=data.map(r=>({code:r.emp_code||r.national_id?.slice(-6)||"", name:r.emp_name, national_id:r.national_id})).filter(e=>e.name);
  populate(uniqueEmployees);
}

function populate(list){
  var c=document.getElementById('optionsList'); c.innerHTML="";
  list.slice(0,500).forEach(emp=>{
    var d=document.createElement('div'); d.className='option';
    d.innerHTML='<span>'+emp.name+'</span><small>'+toArabicDigits(emp.code)+'</small>';
    d.onclick=()=>{
      document.getElementById('empCodeInput').value=toArabicDigits(emp.code);
      document.getElementById('triggerText').textContent=emp.name+' - '+toArabicDigits(emp.code);
      document.getElementById('empCodeInput').dataset.emptid=emp.code;
      document.getElementById('empCodeInput').dataset.national=emp.national_id||"";
      closePanel();
    };
    c.appendChild(d);
  });
  document.getElementById('countInfo').textContent=toArabicDigits(list.length)+' موظف';
}
function filterEmp(){
  var t=document.getElementById('empSearchBox').value.toLowerCase();
  var f=t? uniqueEmployees.filter(e=>e.name.toLowerCase().indexOf(t)>-1||e.code.indexOf(t)>-1) : uniqueEmployees;
  populate(f);
}
function togglePanel(){document.getElementById('selectPanel').classList.toggle('open')}
function closePanel(){document.getElementById('selectPanel').classList.remove('open')}
function toggleSearch(s){document.getElementById('searchCard').style.display=s?'block':'none'; if(s) document.getElementById('displayArea').style.display='none';}

let loadTimer=null;
function startLoadCounter(){
  document.getElementById('loader').style.display='block';
  let sec=0;
  loadTimer=setInterval(()=>{sec++; document.getElementById('loadCounter').textContent=toArabicDigits(sec)+' ث';},1000);
}
function stopLoadCounter(){ clearInterval(loadTimer); document.getElementById('loader').style.display='none'; }

async function executeSearch(){
  var codeEl=document.getElementById('empCodeInput');
  var emptid=codeEl.dataset.emptid;
  if(!emptid){ alert('اختر الموظف'); return; }
  var year=document.getElementById('yearSelect').value;
  var month=document.getElementById('monthSelect').value;
  
  toggleSearch(false); startLoadCounter();
  
  const {data, error}=await supa.from("salaries").select("*").eq("emptid", emptid).eq("sanah", parseInt(year)).eq("shahr", parseInt(month)).limit(1);
  
  stopLoadCounter();
  if(error){ alert("خطأ: "+error.message); toggleSearch(true); return; }
  if(!data || data.length===0){
    document.getElementById('displayArea').style.display='block';
    document.getElementById('displayArea').innerHTML=`<div style="background:#fff;padding:20px;text-align:center;color:red;font-weight:800;border-radius:12px">❌ لا يوجد مرتب لهذا الموظف في ${month}/${year}<br>الموظف: ${emptid}<br>تأكد من رفع المرتبات لهذا الشهر</div><div class="no-print" style="text-align:center;margin-top:10px"><button class="btn-3d btn-back" onclick="toggleSearch(true)">↩ رجوع</button></div>`;
    return;
  }
  renderForm(data[0]);
}

          <colgroup><col style="width:${colWidths.amt1}%"><col style="width:${colWidths.data1}%"><col style="width:${colWidths.amt2}%"><col style="width:${colWidths.data2}%"></colgroup>
          <thead><tr><th colspan="2" style="background:#b71c1c;color:#fff;border:1px solid #000;padding:5px">الإستحقاقات</th><th colspan="2" style="background:#b71c1c;color:#fff;border:1px solid #000;padding:5px">المستقطع</th></tr><tr style="background:#e8f5e9"><th style="border:1px solid #000;padding:4px">المبلغ</th><th style="border:1px solid #000;padding:4px">البيانات</th><th style="border:1px solid #000;padding:4px">المبلغ</th><th style="border:1px solid #000;padding:4px">البيانات</th></tr></thead>
          <tbody style="background:#fff">${table_rows_html}</tbody>
        </table>
      </td></tr></table>
    <table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:${currentFontSize-1}px;font-weight:800;table-layout:fixed">
      <tr>
        <td style="width:25%;border:1px solid #000;padding:5px;text-align:center;background:#fffde7">مسئول الإستحقاقات</td>
        <td style="width:25%;border:1px solid #000;padding:5px;text-align:center;background:#e8f5e9">رئيس الشئون الإدارية</td>
        <td style="width:25%;border:1px solid #000;padding:5px;text-align:center;background:#e3f2fd">مدير عام شبكات بنى سويف</td>
        <td style="width:25%;border:none"></td>
      </tr>
      <tr>
        <td style="border:1px solid #000;height:55px;padding:4px;vertical-align:top">توقيع / <div style="text-align:center;margin-top:18px">------</div></td>
        <td style="border:1px solid #000;height:55px;padding:4px;vertical-align:top">محاسب /<div style="text-align:center;margin-top:18px;color:#b71c1c">إبراهيم محمد سعيد</div></td>
        <td style="border:1px solid #000;height:55px;padding:4px;vertical-align:top">مهندس /<div style="text-align:center;margin-top:18px;color:#0d47a1">سيد محمد عبد الحفيظ</div></td>
        <td style="border:none;padding:4px;text-align:left;line-height:1.2"><span style="font-size:9px">إعداد وتطوير</span><br><b style="font-size:10px">أ/ مصطفى درويش</b><br><span style="font-size:9px">📱 ${toArabicDigits("01092259655")}</span></td>
      </tr>
    </table>
  </div>`;
}

function renderForm(row){
  lastData=row;
  var area=document.getElementById('displayArea'); area.style.display='block';
  
  // بناء الاستحقاقات والمستقطع
  let inst=[], must=[];
  ISTIHQaq_KEYS.forEach(k=>{
    let v=row[k];
    if(v && parseFloat(v)!=0){
      inst.push({key: AR_LABELS[k]||k, val: parseFloat(v).toFixed(2)});
    }
  });
  ISTIQTA_KEYS.forEach(k=>{
    let v=row[k];
    if(v && parseFloat(v)!=0){
      must.push({key: AR_LABELS[k]||k, val: parseFloat(v).toFixed(2)});
    }
  });
  // اضافة الاجماليات
  if(row.egmaly_mostahaq) inst.push({key:"إجمالي المستحق", val: row.egmaly_mostahaq});
  if(row.egmaly_mostaqtaa) must.push({key:"إجمالي المستقطع", val: row.egmaly_mostaqtaa});
  
  var max=Math.max(inst.length, must.length);
  var rowsHtml="";
  for(var i=0;i<max;i++){
    var a=inst[i]||{key:"",val:""};
    var b=must[i]||{key:"",val:""};
    rowsHtml+=`<tr style="height:24px"><td style="border:1px solid #000;padding:2px 3px;text-align:center;font-size:${currentFontSize}px">${a.val?toArabicDigits(a.val):""}</td><td style="border:1px solid #000;padding:2px 6px;text-align:right;font-size:${currentFontSize}px">${a.key}</td><td style="border:1px solid #000;padding:2px 3px;text-align:center;font-size:${currentFontSize}px">${b.val?toArabicDigits(b.val):""}</td><td style="border:1px solid #000;padding:2px 6px;text-align:right;font-size:${currentFontSize}px">${b.key}</td></tr>`;
  }
  if(row.safy){
    rowsHtml+=`<tr><td colspan="2" style="border:2px solid #000;padding:5px;text-align:center;font-weight:900;background:#fff9c4">الصافي</td><td colspan="2" style="border:2px solid #000;padding:5px;text-align:center;font-weight:900;background:#fff176;color:#b71c1c;font-size:${currentFontSize+2}px">${toArabicDigits(parseFloat(row.safy).toFixed(2))}</td></tr>`;
  }
  
  var formHtml=getFormHtmlJS(row.empname||"", row.emptid||"", row.sanah||"", row.shahr||"", row.code_bank||"", row.bank_hesab_no||"", rowsHtml);
  
  area.innerHTML=`
    <div class="no-print" style="max-width:900px;margin:0 auto 6px;display:flex;gap:6px">
      <button class="btn-3d btn-toggle" onclick="document.getElementById('controlsPanel').classList.toggle('show')" style="flex:1">⚙ إعدادات العرض</button>
      <button class="btn-3d btn-back" onclick="toggleSearch(true)">↩ رجوع</button>
    </div>
    <div id="controlsPanel" class="no-print controls-panel show">
      <div class="controls-row">
        <div style="display:flex;align-items:center;gap:4px"><label>🔍 خط:</label><input type="range" min="9" max="16" value="${currentFontSize}" oninput="currentFontSize=this.value; renderForm(lastData)"><span style="font-weight:900;background:rgba(16,185,129,0.2);padding:2px 6px;border-radius:6px;color:#a7f3d0">${toArabicDigits(currentFontSize)}</span></div>
        <div style="display:flex;align-items:center;gap:4px"><label>↔ عرض:</label><input type="range" min="85" max="115" value="${currentWidth}" oninput="currentWidth=this.value; renderForm(lastData)"><span style="font-weight:900;background:rgba(59,130,246,0.2);padding:2px 6px;border-radius:6px;color:#bfdbfe">${toArabicDigits(currentWidth)}%</span></div>
        <button class="btn-3d btn-save" onclick="localStorage.setItem('salarySettings',JSON.stringify({fontSize:currentFontSize,width:currentWidth,colWidths:colWidths})); this.innerText='✅ تم'">💾 حفظ</button>
      </div>
    </div>
    <div class="no-print actions"><button class="btn-3d btn-print" onclick="window.print()">🖨 طباعة</button><button class="btn-3d btn-whats" onclick="downloadImage()">📤 تحميل صورة</button></div>
    ${formHtml}<br>`;
}

async function downloadImage(){
  let area=document.getElementById('printArea');
  let canvas=await html2canvas(area,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
  let link=document.createElement('a');
  link.download=`مرتب-${lastData.empname||lastData.emptid}-${lastData.shahr}-${lastData.sanah}.png`;
  link.href=canvas.toDataURL('image/png');
  link.click();
}

window.onload=()=>{ loadEmployees(); document.addEventListener('click',e=>{ if(!document.getElementById('empCustomSelect').contains(e.target)) closePanel(); }); };
</script>
