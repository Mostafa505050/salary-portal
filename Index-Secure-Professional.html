<style>
*{font-family:'Cairo',sans-serif}
body{background:#020a05;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(900px 500px at 50% 0%, rgba(16,185,129,0.18), transparent 70%), radial-gradient(600px 400px at 0% 100%, rgba(5,150,105,0.12), transparent), #020a05}

.welcome-3d{background:linear-gradient(145deg, rgba(16,185,129,0.18), rgba(139,92,246,0.12));border:1px solid rgba(16,185,129,0.22);border-right:4px solid #10b981;border-bottom:4px solid rgba(16,185,129,0.18);border-radius:16px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,0.25), 0 16px 32px rgba(0,0,0,0.3);position:relative;overflow:hidden}
.welcome-name{font-size:15px;font-weight:900;color:#ecfdf5;text-shadow:0 2px 0 rgba(0,0,0,0.4);line-height:1.4}

<body>
<div class="card">
  <div class="text-center mb-6">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-700 flex items-center justify-center text-2xl shadow-xl">🪪</div>
    <h1 class="text-[19px] font-black text-white mt-3">الدخول الذكي برقم البطاقة</h1>
    <p class="text-[11px] text-white/40 mt-1">نسخة مقسمة احترافياً - نفس التصميم - تم إصلاح خطأ ok</p>
    <span class="badge">🔒 SECURE v2.3 - Fixed return json + split design</span>
  </div>

  <div id="step1">
    <label class="text-[11px] font-bold text-emerald-200/70 mb-2 block">رقم البطاقة القومي (14 رقم)</label>
    <input id="cardNumber" class="input" inputmode="numeric" maxlength="14" placeholder="**************" autocomplete="off" spellcheck="false">
    <button onclick="checkByCard()" id="btnCheck" class="btn btn-primary mt-4">🔍 فحص برقم البطاقة</button>
    <div id="msg1"></div>
  </div>

  <div id="stepReg" class="hidden">
    <div class="welcome-3d">
      <div id="welcomeRegName" class="welcome-name"></div>
      <div id="welcomeRegRole" class="welcome-role"></div>
      <div style="font-size:9px;color:rgba(255,255,255,0.35);margin-top:6px">البصمة فارغة - سجل أول مرة</div>
    </div>
    <div class="mt-4 space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-[10px] text-white/40">الاسم</label><input id="empName" class="input" disabled></div>
        <div><label class="text-[10px] text-white/40">الكود البنكي</label><input id="empCode" class="input" disabled></div>
      </div>
      <input id="newPass" class="input" type="password" placeholder="كلمة مرور جديدة (8 أحرف)" autocomplete="new-password">
      <input id="confirmPass" class="input" type="password" placeholder="تأكيد كلمة المرور" autocomplete="new-password">
      <select id="bioType" class="input">
        <option value="pattern">🔷 نقش (أسرع)</option>
        <option value="fingerprint">👆 بصمة إصبع الجهاز</option>
        <option value="face">🙂 بصمة وجه الجهاز</option>

      <input id="patternVal" class="input" placeholder="قيمة النقش" value="1,2,3,6,9">

  </div>

  <div id="stepLogin" class="hidden">

      <div id="welcomeLoginName" class="welcome-name"></div>
      <div id="welcomeLoginRole" class="welcome-role"></div>
      <div style="font-size:9px;color:rgba(255,255,255,0.35);margin-top:6px">تم العثور على بصمة - سيتم التحقق من الخادم</div>
    </div>
    <div class="mt-4 space-y-3">
      <button onclick="loginWithBio()" class="btn btn-primary">🔓 دخول بالبصمة / النقش</button>
      <div class="flex gap-2">
        <input id="loginPass" class="input flex-1" type="password" placeholder="كلمة المرور">
        <button onclick="loginWithPass()" class="px-5 h-[54px] rounded-xl bg-white/5 border border-white/10 text-[12px] text-emerald-200">دخول</button>
      </div>
    </div>
    <div id="msgLogin"></div>
  </div>

  <div class="mt-6 flex gap-2">
    <button onclick="safeReload()" class="flex-1 h-9 rounded-xl bg-white/5 border border-white/10 text-[11px] text-white/40">🔄 إعادة</button>
    <button onclick="secureLogout()" class="flex-1 h-9 rounded-xl bg-red-500/10 border border-red-500/20 text-[11px] text-red-300">🚪 خروج آمن</button>
  </div>
</div>

<script>
'use strict';
const SECURITY = {
  API_BASE: "https://salary-portal.mostafa-voic77729.workers.dev",
  TIMEOUT_MS: 12000,
  MAX_ATTEMPTS: 5,
  LOCKOUT_MS: 5 * 60 * 1000,
  NATIONAL_ID_REGEX: /^\d{14}$/,
  CODE_REGEX: /^[A-Za-z0-9_\-]{2,30}$/,
  PASSWORD_MIN_LEN: 8,
  ALLOWED_PAGES: ['pageAdmin1','pageUser1','pageAdmin','pageUser','index.html','dashboard.html','home.html'],
  PATTERN_REGEX: /^[0-9,\s]{1,50}$/
};
let currentUser=null,currentRouting=null,failedAttempts=0,lockoutUntil=0,lastFetchTime=0;

function escapeHtml(str){
  if(str==null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function safeJsonParse(str,fallback=null){
  try{
    if(!str||typeof str!=='string') return fallback;
    if(str.length>10000) return fallback;
    const obj=JSON.parse(str);
    if(typeof obj!=='object'||obj===null) return fallback;
    if(Object.prototype.hasOwnProperty.call(obj,'__proto__')) return fallback;
    if(Object.prototype.hasOwnProperty.call(obj,'constructor')) return fallback;
    if(Object.prototype.hasOwnProperty.call(obj,'prototype')) return fallback;
    return obj;
  }catch{return fallback;}
}
function hasDangerousKeys(obj){
  if(!obj||typeof obj!=='object') return false;
  if(Object.prototype.hasOwnProperty.call(obj,'__proto__')) return true;
  if(Object.prototype.hasOwnProperty.call(obj,'constructor')) return true;
  if(Object.prototype.hasOwnProperty.call(obj,'prototype')) return true;
  return false;
}
function sanitizeForLog(s){return String(s||'').substring(0,50).replace(/[\r\n<>]/g,'');}
function isLockedOut(){const now=Date.now();if(lockoutUntil>now)return Math.ceil((lockoutUntil-now)/1000);return 0;}
function registerFailedAttempt(){failedAttempts++;if(failedAttempts>=SECURITY.MAX_ATTEMPTS){lockoutUntil=Date.now()+SECURITY.LOCKOUT_MS;failedAttempts=0;}}
function resetAttempts(){failedAttempts=0;lockoutUntil=0;}
function bufferToBase64Url(buf){const bytes=new Uint8Array(buf);let bin='';for(let i=0;i<bytes.byteLength;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function base64UrlToBuffer(b64url){const b64=b64url.replace(/-/g,'+').replace(/_/g,'/');const pad=b64.length%4;const padded=pad?b64+'='.repeat(4-pad):b64;const bin=atob(padded);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return bytes.buffer;}

// ===== الإصلاح الأساسي هنا - كان ناقص return json =====
async function secureFetch(url, options={}){
  const now=Date.now();
  if(now-lastFetchTime<300) throw new Error('طلبات كثيرة - انتظر قليلا');
  lastFetchTime=now;
  const controller=new AbortController();
  const timeoutId=setTimeout(()=>controller.abort(),SECURITY.TIMEOUT_MS);
  try{
    const res=await fetch(url,{
      ...options,
      signal:controller.signal,
      headers:{'Accept':'application/json','Content-Type':'application/json','X-Requested-With':'SecureLogin-v2',...(options.headers||{})},
      credentials:'omit',mode:'cors',cache:'no-store'
    });
    clearTimeout(timeoutId);
    if(!res.ok){
      if(res.status===429) throw new Error('ضغط على الخادم - حاول لاحقاً');
      if(res.status===403) throw new Error('محظور - تواصل مع المسؤول');
      if(res.status>=500) throw new Error('خطأ مؤقت في الخادم');
      throw new Error(`فشل الطلب ${res.status}`);
    }
    const contentType=res.headers.get('content-type')||'';
    if(!contentType.includes('application/json')) throw new Error('استجابة غير متوقعة من الخادم');
    const text=await res.text();
    if(text.length>200000) throw new Error('بيانات كبيرة جداً');
    let json;
    try{ json=JSON.parse(text); }catch{ throw new Error('استجابة غير صالحة من الخادم'); }
    if(hasDangerousKeys(json)) throw new Error('بيانات مشبوهة');
    if(json.user&&hasDangerousKeys(json.user)) throw new Error('بيانات مشبوهة');
    if(json.routing&&hasDangerousKeys(json.routing)) throw new Error('بيانات مشبوهة');
    return json; // <-- هذا السطر كان ناقص وسبب خطأ ok
  }catch(err){
    clearTimeout(timeoutId);
    if(err.name==='AbortError') throw new Error('انتهت مهلة الاتصال - تحقق من الإنترنت');
    throw err;
  }
}

function showMsg(id,text,type='error'){
  const el=document.getElementById(id);if(!el)return;el.textContent='';if(!text)return;
  const d=document.createElement('div');d.className=`msg ${type==='error'?'msg-error':'msg-success'}`;d.textContent=text;el.appendChild(d);
}
async function getRoutingFromTable(nationalId,code){
  try{
    if(!SECURITY.NATIONAL_ID_REGEX.test(String(nationalId))&&!SECURITY.CODE_REGEX.test(String(code))) return null;
    const url=`${SECURITY.API_BASE}/api/get-routing-secure?nationalId=${encodeURIComponent(nationalId)}&code=${encodeURIComponent(code)}`;
    const j=await secureFetch(url,{method:'GET'});
    if(j&&j.found&&j.routing){
      const r=j.routing;
      if(r["تاريخ_الانتهاء"]){const end=new Date(r["تاريخ_الانتهاء"]);if(new Date()>end) return null;}
      if(hasDangerousKeys(r)) return null;
      return r;
    }
  }catch(e){console.error('خطأ جلب التوجيه',sanitizeForLog(e.message));}
  return null;
}
function getRedirectFromRouting(routing,fallbackRole){
  let page=null;if(routing&&routing["الصفحة_الافتراضية"]) page=String(routing["الصفحة_الافتراضية"]).trim();
  if(page&&SECURITY.ALLOWED_PAGES.includes(page)) return page;
  const role=(fallbackRole||'').toLowerCase();if(role.includes('admin')) return 'pageAdmin1';return 'pageUser1';
}
function safeRedirect(page){if(!SECURITY.ALLOWED_PAGES.includes(page)) page='pageUser1';location.href=page;}
function safeReload(){document.querySelectorAll('input[type="password"]').forEach(i=>i.value='');location.reload();}
function secureLogout(){try{['logged_user','secure_token','entry_via_index','empCode','emptid','cardNumber'].forEach(k=>localStorage.removeItem(k));safeReload();}catch(e){localStorage.clear();location.href='index.html';}}

async function checkByCard(){
  const locked=isLockedOut();if(locked){showMsg('msg1',`محظور مؤقتاً - حاول بعد ${locked} ثانية`,'error');return;}
  const card=document.getElementById('cardNumber').value.trim();
  if(!SECURITY.NATIONAL_ID_REGEX.test(card)){showMsg('msg1','رقم البطاقة يجب أن يكون 14 رقم بالضبط','error');registerFailedAttempt();return;}
  const btn=document.getElementById('btnCheck');btn.textContent='⏳ يفحص...';btn.disabled=true;showMsg('msg1','');
  try{
    const data=await secureFetch(`${SECURITY.API_BASE}/api/check-by-card-secure`,{method:'POST',body:JSON.stringify({cardNumber:card})});
    if(!data||typeof data.ok==='undefined'){throw new Error('استجابة غير صالحة من الخادم - تحقق من Worker');}
    if(!data.ok){showMsg('msg1','❌ '+escapeHtml(data.msg),'error');registerFailedAttempt();return;}
    currentUser=data.user;resetAttempts();
    if(hasDangerousKeys(currentUser)){showMsg('msg1','بيانات مشبوهة','error');return;}
    const name=escapeHtml(currentUser['اسم_العمل']||currentUser['اسم_العامل']||'مستخدم');
    const code=escapeHtml(currentUser['الكود_البنكى']||'--');
    const bio=currentUser['بصمة'];const role=escapeHtml(currentUser['الصلاحيات']||'User');
    const isEmpty=!bio||String(bio).trim()===''||String(bio).toLowerCase()==='null';
    currentRouting=await getRoutingFromTable(card,code);
    if(isEmpty){
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('stepReg').classList.remove('hidden');
      document.getElementById('empName').value=name;document.getElementById('empCode').value=code;
      document.getElementById('welcomeRegName').textContent=`مرحبا ${name}`;
      document.getElementById('welcomeRegRole').textContent=`الصلاحية ${role} - الكود ${code}`;
    }else{
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('stepLogin').classList.remove('hidden');
      document.getElementById('welcomeLoginName').textContent=`مرحبا ${name}`;
      document.getElementById('welcomeLoginRole').textContent=`مرحبا ${name} - ${role}`;
    }
  }catch(e){showMsg('msg1','خطأ اتصال: '+escapeHtml(e.message),'error');registerFailedAttempt();}
  finally{btn.textContent='🔍 فحص برقم البطاقة';btn.disabled=false;}
}

async function registerByCard(){
  const locked=isLockedOut();if(locked){showMsg('msgReg',`محظور بعد ${locked} ثانية`,'error');return;}
  const newPass=document.getElementById('newPass').value.trim();
  const confirm=document.getElementById('confirmPass').value.trim();
  const bioType=document.getElementById('bioType').value;
  let bioVal=document.getElementById('patternVal').value.trim()||'1,2,3,6,9';
  if(newPass.length<SECURITY.PASSWORD_MIN_LEN){showMsg('msgReg',`كلمة المرور ${SECURITY.PASSWORD_MIN_LEN} أحرف على الأقل`,'error');return;}
  if(newPass!==confirm){showMsg('msgReg','كلمتا المرور غير متطابقتين','error');return;}
  if(bioType==='pattern'&&!SECURITY.PATTERN_REGEX.test(bioVal)){showMsg('msgReg','النقش أرقام وفواصل فقط','error');return;}
  let bioJson;
  if(bioType==='fingerprint'||bioType==='face'){
    try{
      const challenge=new Uint8Array(32);crypto.getRandomValues(challenge);
      const cred=await navigator.credentials.create({publicKey:{challenge,rp:{name:"شئون العاملين"},user:{id:new TextEncoder().encode(String(currentUser['الرقم_القومى'])),name:currentUser['اسم_العمل']||'user',displayName:currentUser['اسم_العمل']||'user'},pubKeyCredParams:[{alg:-7,type:"public-key"}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000}});
      bioJson=JSON.stringify({type:bioType,credId:bufferToBase64Url(cred.rawId),created:Date.now()});
    }catch(err){showMsg('msgReg','فشل بصمة الجهاز: '+escapeHtml(err.message),'error');return;}
  }else{bioJson=JSON.stringify({type:'pattern',value:bioVal,created:Date.now()});}
  const btn=document.getElementById('btnReg');btn.textContent='⏳ يحفظ...';btn.disabled=true;
  try{
    const data=await secureFetch(`${SECURITY.API_BASE}/api/register-by-card-secure`,{method:'POST',body:JSON.stringify({cardNumber:String(currentUser['الرقم_القومى']),bio:bioJson,password:newPass})});
    if(!data.ok) throw new Error(data.msg);
    showMsg('msgReg','✅ تم الحفظ بنجاح! إعادة تحميل...','success');resetAttempts();setTimeout(()=>safeReload(),1500);
  }catch(e){showMsg('msgReg','فشل: '+escapeHtml(e.message),'error');registerFailedAttempt();}
  finally{btn.textContent='💾 تسجيل البصمة لأول مرة';btn.disabled=false;}
}

async function loginWithBio(){
  const locked=isLockedOut();if(locked){showMsg('msgLogin',`محظور بعد ${locked} ثانية`,'error');return;}
  try{
    const bio=currentUser['بصمة'];if(!bio){showMsg('msgLogin','لا توجد بصمة','error');return;}
    const saved=safeJsonParse(bio);if(!saved){showMsg('msgLogin','بيانات البصمة تالفة','error');return;}
    if(saved.type==='pattern'){
      const input=prompt('أدخل النقش:');if(!input)return;
      if(input.trim()!==saved.value){showMsg('msgLogin','❌ النقش غير مطابق','error');registerFailedAttempt();return;}
      const data=await secureFetch(`${SECURITY.API_BASE}/api/bio-login-by-card-secure`,{method:'POST',body:JSON.stringify({cardNumber:String(currentUser['الرقم_القومى']),bioAttempt:input.trim()})});
      if(!data.ok) throw new Error(data.msg);await doRedirect(data);
    }else{
      const challenge=new Uint8Array(32);crypto.getRandomValues(challenge);
      const credIdBuffer=base64UrlToBuffer(saved.credId);
      await navigator.credentials.get({publicKey:{challenge,allowCredentials:[{id:credIdBuffer,type:'public-key'}],userVerification:"required",timeout:60000}});
      const data=await secureFetch(`${SECURITY.API_BASE}/api/bio-login-by-card-secure`,{method:'POST',body:JSON.stringify({cardNumber:String(currentUser['الرقم_القومى'])})});
      if(!data.ok) throw new Error(data.msg);await doRedirect(data);
    }
    resetAttempts();
  }catch(e){showMsg('msgLogin','فشل البصمة: '+escapeHtml(e.message),'error');registerFailedAttempt();}
}

async function loginWithPass(){
  const locked=isLockedOut();if(locked){showMsg('msgLogin',`محظور بعد ${locked} ثانية`,'error');return;}
  const pass=document.getElementById('loginPass').value.trim();if(pass.length<3){showMsg('msgLogin','كلمة المرور قصيرة','error');return;}
  try{
    const data=await secureFetch(`${SECURITY.API_BASE}/api/verify-password-secure`,{method:'POST',body:JSON.stringify({cardNumber:String(currentUser['الرقم_القومى']),password:pass})});
    if(!data.ok){showMsg('msgLogin','❌ بيانات غير صحيحة','error');registerFailedAttempt();return;}
    if(!currentRouting) currentRouting=await getRoutingFromTable(String(currentUser['الرقم_القومى']),String(currentUser['الكود_البنكى']||''));
    const role=escapeHtml(currentUser['الصلاحيات']||'User');const redirectPage=getRedirectFromRouting(currentRouting,role);
    const token=data.token;if(!token||token.length<20) throw new Error('توكن غير صالح');
    localStorage.setItem('secure_token',token);
    const loggedData={card:currentUser['الرقم_القومى'],code:currentUser['الكود_البنكى'],"الكود_البنكى":currentUser['الكود_البنكى'],emptid:currentUser['الكود_البنكى'],name:currentUser['اسم_العمل']||currentUser['اسم_العامل'],role:currentRouting?currentRouting["الصلاحية"]:role,defaultPage:redirectPage,routing:currentRouting,loginTime:Date.now()};
    if(hasDangerousKeys(loggedData)) throw new Error('بيانات مشبوهة');
    localStorage.setItem('logged_user',JSON.stringify(loggedData));
    localStorage.setItem('entry_via_index',String(Date.now()));
    showMsg('msgLogin',`✅ مرحبا ${escapeHtml(loggedData.name)} - ينتقل إلى ${escapeHtml(redirectPage)}...`,'success');resetAttempts();setTimeout(()=>safeRedirect(redirectPage),800);
  }catch(e){showMsg('msgLogin','خطأ: '+escapeHtml(e.message),'error');registerFailedAttempt();}
}

async function doRedirect(apiData){
  const role=escapeHtml(apiData.role||currentUser['الصلاحيات']||'User');
  if(!currentRouting) currentRouting=await getRoutingFromTable(String(currentUser['الرقم_القومى']),String(currentUser['الكود_البنكى']||''));
  const redirectPage=getRedirectFromRouting(currentRouting,role);
  const token=apiData.token;if(!token||token.length<20) throw new Error('توكن غير صالح');
  localStorage.setItem('secure_token',token);
  const loggedData={card:currentUser['الرقم_القومى'],code:currentUser['الكود_البنكى'],"الكود_البنكى":currentUser['الكود_البنكى'],emptid:currentUser['الكود_البنكى'],name:currentUser['اسم_العمل']||currentUser['اسم_العامل'],role:currentRouting?currentRouting["الصلاحية"]:role,defaultPage:redirectPage,routing:currentRouting,loginTime:Date.now()};
  localStorage.setItem('logged_user',JSON.stringify(loggedData));
  localStorage.setItem('entry_via_index',String(Date.now()));
  showMsg('msgLogin',`✅ تم التحقق - ${escapeHtml(loggedData.name)} - ${escapeHtml(redirectPage)}...`,'success');
  setTimeout(()=>safeRedirect(redirectPage),800);
}
if(window.top!==window.self){try{window.top.location=window.self.location;}catch(e){window.self.location='about:blank';}}
</script>
