<title>إدارة توجيه_المستخدمين - إضافة احترافي 3D - بيج غامق</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',Tahoma;margin:0;padding:0}
body{
  background:#8b7a62;
  background-image:
    radial-gradient(900px 500px at 15% 10%, rgba(255,251,243,0.30), transparent 60%),
    radial-gradient(700px 500px at 85% 85%, rgba(60,50,35,0.30), transparent 60%);
  min-height:100vh;padding:14px;color:#3a2f24;
}
.top-glass{
  max-width:1100px;margin:0 auto 14px;
  background:linear-gradient(180deg,rgba(255,251,243,0.62),rgba(255,251,243,0.28));
  backdrop-filter:blur(20px);border:1px solid rgba(120,100,80,0.22);border-right:6px solid #7a6652;
  border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 0 rgba(60,50,35,0.12),0 16px 32px rgba(60,50,35,0.14);
}
.card-3d{
  max-width:1100px;margin:0 auto;
  background:linear-gradient(145deg,rgba(255,251,243,0.82),rgba(255,251,243,0.38));
  backdrop-filter:blur(22px);border:1px solid rgba(120,100,80,0.22);border-right:6px solid #7a6652;
  border-bottom:6px solid rgba(60,50,35,0.15);border-radius:20px;padding:18px;
  box-shadow:0 14px 0 rgba(60,50,35,0.13),0 28px 60px rgba(60,50,35,0.18);
  transform-style:preserve-3d;
}
.label-3d{font-size:11px;font-weight:800;color:#4a3f32;margin-bottom:5px;display:block}
.input-3d, .select-3d, .textarea-3d{
  width:100%;padding:11px 12px;border-radius:12px;
  border:1.5px solid rgba(120,100,80,0.22);background:rgba(255,251,243,0.88);
  color:#2c241c;font-size:12px;font-weight:700;outline:none;
  box-shadow:0 4px 0 rgba(60,50,35,0.06) inset, 0 2px 8px rgba(60,50,35,0.05);transition:.2s;
}
.input-3d:focus, .select-3d:focus, .textarea-3d:focus{border-color:#7a6652;background:#fff;box-shadow:0 0 0 3px rgba(122,102,82,0.15),0 4px 0 rgba(60,50,35,0.06) inset}
.textarea-3d{min-height:70px;resize:vertical}
.btn-3d{padding:12px 16px;border-radius:12px;border:none;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 7px 0 rgba(60,50,35,0.22),0 12px 24px rgba(60,50,35,0.16);transition:.13s;font-size:12px}
.btn-3d:active{transform:translateY(7px);box-shadow:none}
.btn-primary{background:linear-gradient(180deg,#7a6652,#4a3f32)}
.btn-green{background:linear-gradient(180deg,#34d399,#065f46)}
.btn-back{background:linear-gradient(180deg,#6b5e4d,#3f362b)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:800px){.grid-2,.grid-3{grid-template-columns:1fr}}
/* بحث الموظفين */
.search-wrap{position:relative}
.search-list{
  position:absolute;top:100%;left:0;right:0;z-index:20;
  background:linear-gradient(180deg,rgba(255,251,243,0.98),rgba(255,251,243,0.92));
  border:1px solid rgba(120,100,80,0.22);border-top:none;
  border-radius:0 0 12px 12px;max-height:260px;overflow:auto;
  box-shadow:0 12px 24px rgba(60,50,35,0.18);display:none;
}
.search-list.show{display:block}
.search-item{padding:8px 12px;font-size:11px;font-weight:700;cursor:pointer;border-bottom:1px solid rgba(120,100,80,0.10);display:flex;justify-content:space-between;gap:8px}
.search-item:hover{background:rgba(122,102,82,0.12)}
.search-item small{color:#7a6652}
.status{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:11px;font-weight:800;display:none;border:1px solid}
.status.show{display:block}
.status-ok{background:linear-gradient(180deg,rgba(220,252,231,0.8),rgba(187,247,208,0.5));border-color:rgba(16,185,129,0.22);border-right:4px solid #10b981;color:#065f46}
.status-err{background:linear-gradient(180deg,rgba(254,226,226,0.8),rgba(252,165,165,0.4));border-color:rgba(239,68,68,0.22);border-right:4px solid #ef4444;color:#7f1d1d}
</style>

    <div style="display:flex;justify-content:space-between;align-items:center">
      <b style="font-size:12px">📋 الموجودون حالياً في توجيه_المستخدمين</b>
      <button class="btn-3d btn-back" style="padding:6px 10px;font-size:10px" onclick="loadExisting()">🔄 تحديث القائمة</button>
    </div>
    <div id="existingList" style="margin-top:8px;max-height:260px;overflow:auto;border:1px solid rgba(120,100,80,0.15);border-radius:12px;background:rgba(255,251,243,0.5)"></div>
  </div>
</div>

<script>
const API_BASE = "https://turso-api.mostafa-voic77729.workers.dev";
let employees = [];
let filtered = [];

function showStatus(msg, type='ok'){
  const el=document.getElementById('status');
  el.className=`status show status-${type}`;
  el.innerHTML=msg;
}
function setAllowed(t){
  if(t==='user'){ document.getElementById('allowed').value='["my_data.html","family.html","salary.html","salary_log.html","tadarg.html","phone.html"]'; document.getElementById('defaultPage').value='pageUser1-FINAL-WITH-SALARY.html'; document.getElementById('role').value='User'; document.getElementById('type').value='عام'; }
  if(t==='special'){ document.getElementById('allowed').value='["salary.html","hafez.html","salary_log.html","my_data.html"]'; document.getElementById('defaultPage').value='login-gateway-28801082200973.html'; document.getElementById('role').value='Special'; document.getElementById('type').value='خاص'; }
  if(t==='admin'){ document.getElementById('allowed').value='["*"]'; document.getElementById('defaultPage').value='pageAdmin1-FINAL-BEIGE-FIXED-AUTH.html'; document.getElementById('role').value='Admin'; document.getElementById('type').value='عام'; }
}
async function turso(sql){
  const r=await fetch(API_BASE+'/api/turso',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql})});
  const j=await r.json(); if(!j.ok) throw new Error(j.msg); return j.rows||[];
}
async function loadEmployees(){
  try{
    const rows = await turso(`SELECT "الرقم_القومى" as nid, "الكود_البنكى" as code, "اسم_العامل" as name, "الصلاحيات" as role FROM "موظفين_مرتبات" WHERE "اسم_العامل" IS NOT NULL ORDER BY "اسم_العامل" LIMIT 5000`);
    employees = rows.filter(r=>r.code && r.name).map(r=>({nid:String(r.nid||'').trim(), code:String(r.code||'').trim(), name:String(r.name||'').trim(), role:String(r.role||'User').trim()})).filter(r=>/^\d{14}$/.test(r.nid)||true);
    filtered = employees;
    renderDropdown();
    renderSearchList();
    document.getElementById('empCount').textContent=`${employees.length} موظف من موظفين_مرتبات`;
  }catch(e){ document.getElementById('empCount').textContent='❌ '+e.message; }
}
function renderDropdown(){
  const sel=document.getElementById('empDropdown');
  sel.innerHTML='<option value="">-- اختر موظفاً --</option>';
  filtered.slice(0,300).forEach((emp,i)=>{
    const opt=document.createElement('option');
    opt.value=i; opt.textContent=`${emp.name} - ${emp.code} - ${emp.nid.slice(0,4)}****`;
    sel.appendChild(opt);
  });
}
function renderSearchList(){
  const list=document.getElementById('searchList');
  list.innerHTML='';
  filtered.slice(0,80).forEach((emp, idx)=>{
    const div=document.createElement('div'); div.className='search-item';
    div.innerHTML=`<span>${emp.name}</span><small>${emp.code} • ${emp.nid}</small>`;
    div.onclick=()=>{ selectEmployee(emp); hideList(); };
    list.appendChild(div);
  });
}
function filterEmployees(){
  const q=document.getElementById('empSearch').value.trim().toLowerCase();
  if(!q){ filtered=employees; }else{ filtered=employees.filter(e=> e.name.toLowerCase().includes(q) || e.code.includes(q) || e.nid.includes(q)); }
  renderDropdown(); renderSearchList(); showList();
  document.getElementById('empCount').textContent=`${filtered.length} نتيجة بحث`;
}
function showList(){ document.getElementById('searchList').classList.add('show'); }
function hideList(){ setTimeout(()=>document.getElementById('searchList').classList.remove('show'),150); }
function onDropdownSelect(){
  const idx=document.getElementById('empDropdown').value;
  if(idx==='') return;
  const emp=filtered[Number(idx)]; if(emp) selectEmployee(emp);
}
function selectEmployee(emp){
  document.getElementById('nationalId').value=emp.nid;
  document.getElementById('bankCode').value=emp.code;
  document.getElementById('empName').value=emp.name;
  document.getElementById('empSearch').value=emp.name;
  document.getElementById('selectedInfo').textContent=`✅ تم اختيار: ${emp.name} - ${emp.code}`;
  document.getElementById('empDropdown').value='';
  // اقتراح توجيه حسب الصلاحية
  if(emp.role.toLowerCase().includes('admin')) setAllowed('admin'); else setAllowed('user');
  // لو الكود 40001 (حالة 2880) اقترح special
  if(emp.code==='40001' || emp.nid==='28801082200973') setAllowed('special');
  updatePreview();
}
function updatePreview(){
  const data={
    الرقم_القومى: document.getElementById('nationalId').value.trim(),
    الكود_البنكى: document.getElementById('bankCode').value.trim(),
    اسم_العامل: document.getElementById('empName').value.trim(),
    الصلاحية: document.getElementById('role').value,
    الصفحة_الافتراضية: document.getElementById('defaultPage').value.trim(),
    الصفحات_المسموحة: document.getElementById('allowed').value.trim(),
    الصفحات_الممنوعة: document.getElementById('denied').value.trim(),
    نوع_التوجيه: document.getElementById('type').value,
    سبب_التوجيه: document.getElementById('reason').value.trim(),
    مفعلة: document.getElementById('active').value,
    تاريخ_البداية: document.getElementById('startDate').value,
    تاريخ_الانتهاء: document.getElementById('endDate').value,
    أنشأ_بواسطة: document.getElementById('createdBy').value.trim(),
    تاريخ_التحديث: new Date().toISOString()
  };
  document.getElementById('preview').style.display='block';
  document.getElementById('previewText').textContent=JSON.stringify(data,null,2);
  document.getElementById('updated').value=new Date().toLocaleString('ar-EG');
  return data;
}
async function saveRouting(){
  const d=updatePreview();
  if(!/^\d{14}$/.test(d.الرقم_القومى)){ showStatus('❌ الرقم القومي يجب 14 رقم','err'); return; }
  if(!d.الكود_البنكى){ showStatus('❌ الكود البنكي مطلوب','err'); return; }
  try{
    // تحقق JSON
    try{ JSON.parse(d.الصفحات_المسموحة); }catch{ showStatus('❌ الصفحات_المسموحة يجب أن تكون JSON صحيح مثال ["salary.html"]','err'); return; }
    try{ JSON.parse(d.الصفحات_الممنوعة); }catch{ showStatus('❌ الصفحات_الممنوعة يجب JSON','err'); return; }
    const sql=`INSERT INTO "توجيه_المستخدمين" ("الرقم_القومى","الكود_البنكى","اسم_العامل","الصلاحية","الصفحة_الافتراضية","الصفحات_المسموحة","الصفحات_الممنوعة","نوع_التوجيه","سبب_التوجيه","مفعلة","تاريخ_البداية","تاريخ_الانتهاء","أنشأ_بواسطة","تاريخ_التحديث") VALUES ('${d.الرقم_القومى.replace(/'/g,"''")}','${d.الكود_البنكى.replace(/'/g,"''")}','${d.اسم_العامل.replace(/'/g,"''")}','${d.الصلاحية}','${d.الصفحة_الافتراضية.replace(/'/g,"''")}','${d.الصفحات_المسموحة.replace(/'/g,"''")}','${d.الصفحات_الممنوعة.replace(/'/g,"''")}','${d.نوع_التوجيه}','${d.سبب_التوجيه.replace(/'/g,"''")}',${d.مفعلة},'${d.تاريخ_البداية}','${d.تاريخ_الانتهاء}','${d.أنشأ_بواسطة.replace(/'/g,"''")}','${d.تاريخ_التحديث}')`;
    await turso(sql);
    showStatus(`✅ تم الحفظ في جدول <b>توجيه_المستخدمين</b> للكود ${d.الكود_البنكى} - ${d.اسم_العامل} - الصفحة الافتراضية: ${d.الصفحة_الافتراضية}`,'ok');
    loadExisting();
  }catch(e){
    if(e.message.includes('UNIQUE')||e.message.includes('PRIMARY')) showStatus('⚠️ الرقم القومي موجود مسبقاً - استخدم تحديث (UPSERT)','err');
    else showStatus('❌ خطأ: '+e.message,'err');
  }
}
async function updateRouting(){
  const d=updatePreview();
  if(!/^\d{14}$/.test(d.الرقم_القومى)){ showStatus('❌ الرقم القومي 14 رقم','err'); return; }
  try{
    const sql=`INSERT INTO "توجيه_المستخدمين" ("الرقم_القومى","الكود_البنكى","اسم_العامل","الصلاحية","الصفحة_الافتراضية","الصفحات_المسموحة","الصفحات_الممنوعة","نوع_التوجيه","سبب_التوجيه","مفعلة","تاريخ_البداية","تاريخ_الانتهاء","أنشأ_بواسطة","تاريخ_التحديث") VALUES ('${d.الرقم_القومى.replace(/'/g,"''")}','${d.الكود_البنكى.replace(/'/g,"''")}','${d.اسم_العامل.replace(/'/g,"''")}','${d.الصلاحية}','${d.الصفحة_الافتراضية.replace(/'/g,"''")}','${d.الصفحات_المسموحة.replace(/'/g,"''")}','${d.الصفحات_الممنوعة.replace(/'/g,"''")}','${d.نوع_التوجيه}','${d.سبب_التوجيه.replace(/'/g,"''")}',${d.مفعلة},'${d.تاريخ_البداية}','${d.تاريخ_الانتهاء}','${d.أنشأ_بواسطة.replace(/'/g,"''")}','${d.تاريخ_التحديث}') ON CONFLICT("الرقم_القومى") DO UPDATE SET "الكود_البنكى"=excluded."الكود_البنكى","اسم_العامل"=excluded."اسم_العامل","الصلاحية"=excluded."الصلاحية","الصفحة_الافتراضية"=excluded."الصفحة_الافتراضية","الصفحات_المسموحة"=excluded."الصفحات_المسموحة","الصفحات_الممنوعة"=excluded."الصفحات_الممنوعة","نوع_التوجيه"=excluded."نوع_التوجيه","سبب_التوجيه"=excluded."سبب_التوجيه","مفعلة"=excluded."مفعلة","تاريخ_البداية"=excluded."تاريخ_البداية","تاريخ_الانتهاء"=excluded."تاريخ_الانتهاء","أنشأ_بواسطة"=excluded."أنشأ_بواسطة","تاريخ_التحديث"=excluded."تاريخ_التحديث"`;
    await turso(sql);
    showStatus(`✅ تم التحديث (UPSERT) للرقم ${d.الرقم_القومى} - ${d.اسم_العامل}`,'ok');
    loadExisting();
  }catch(e){ showStatus('❌ خطأ: '+e.message,'err'); }
}
function clearForm(){
  ['nationalId','bankCode','empName','defaultPage','reason'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('empSearch').value=''; document.getElementById('selectedInfo').textContent=''; document.getElementById('preview').style.display='none';
  document.getElementById('startDate').value=new Date().toISOString().slice(0,10);
}
async function loadExisting(){
  try{
    const rows=await turso(`SELECT "الرقم_القومى","الكود_البنكى","اسم_العامل","الصلاحية","الصفحة_الافتراضية","نوع_التوجيه","مفعلة" FROM "توجيه_المستخدمين" ORDER BY "تاريخ_التحديث" DESC LIMIT 100`);
    const div=document.getElementById('existingList');
    if(!rows.length){ div.innerHTML='<div style="padding:12px;font-size:11px;text-align:center;color:#7a6652">لا يوجد بيانات</div>'; return; }
    let html='<table style="width:100%;font-size:10px;border-collapse:collapse"><thead><tr style="background:#7a6652;color:#fff"><th style="padding:6px;border:1px solid #4a3f32">الرقم القومي</th><th style="padding:6px;border:1px solid #4a3f32">الكود البنكي</th><th style="padding:6px;border:1px solid #4a3f32">الاسم</th><th style="padding:6px;border:1px solid #4a3f32">الصلاحية</th><th style="padding:6px;border:1px solid #4a3f32">الصفحة الافتراضية</th><th style="padding:6px;border:1px solid #4a3f32">مفعلة</th><th style="padding:6px;border:1px solid #4a3f32">إجراء</th></tr></thead><tbody>';
    rows.forEach(r=>{
      html+=`<tr><td style="padding:5px;border:1px solid #c9b99f">${r["الرقم_القومى"]}</td><td style="padding:5px;border:1px solid #c9b99f">${r["الكود_البنكى"]}</td><td style="padding:5px;border:1px solid #c9b99f">${r["اسم_العامل"]}</td><td style="padding:5px;border:1px solid #c9b99f">${r["الصلاحية"]}</td><td style="padding:5px;border:1px solid #c9b99f">${r["الصفحة_الافتراضية"]}</td><td style="padding:5px;border:1px solid #c9b99f">${r["مفعلة"]==1?'✅':'🚫'}</td><td style="padding:5px;border:1px solid #c9b99f"><button onclick="editExisting('${r["الرقم_القومى"]}')" style="background:#7a6652;color:#fff;border:none;padding:3px 8px;border-radius:6px;font-size:9px;cursor:pointer">تحرير</button></td></tr>`;
    });
    html+='</tbody></table>'; div.innerHTML=html;
  }catch(e){ document.getElementById('existingList').innerHTML='<div style="padding:10px;color:red;font-size:11px">'+e.message+'</div>'; }
}
async function editExisting(nid){
  try{
    const rows=await turso(`SELECT * FROM "توجيه_المستخدمين" WHERE "الرقم_القومى"='${nid.replace(/'/g,"''")}' LIMIT 1`);
    if(!rows.length) return;
    const r=rows[0];
    document.getElementById('nationalId').value=r["الرقم_القومى"]||'';
    document.getElementById('bankCode').value=r["الكود_البنكى"]||'';
    document.getElementById('empName').value=r["اسم_العامل"]||'';
    document.getElementById('role').value=r["الصلاحية"]||'User';
    document.getElementById('defaultPage').value=r["الصفحة_الافتراضية"]||'';
    document.getElementById('allowed').value=r["الصفحات_المسموحة"]||'[]';
    document.getElementById('denied').value=r["الصفحات_الممنوعة"]||'[]';
    document.getElementById('type').value=r["نوع_التوجيه"]||'عام';
    document.getElementById('reason').value=r["سبب_التوجيه"]||'';
    document.getElementById('active').value=r["مفعلة"]||1;
    document.getElementById('startDate').value=r["تاريخ_البداية"]||'';
    document.getElementById('endDate').value=r["تاريخ_الانتهاء"]||'';
    document.getElementById('createdBy').value=r["أنشأ_بواسطة"]||'Admin';
    updatePreview();
    window.scrollTo({top:0,behavior:'smooth'});
    showStatus(`✏️ تم تحميل بيانات ${r["اسم_العامل"]} للتحرير - عدل ثم اضغط تحديث`,'ok');
  }catch(e){ showStatus('❌ '+e.message,'err'); }
}

document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-wrap')) hideList();
});

window.onload=()=>{
  const today=new Date().toISOString().slice(0,10);
  document.getElementById('startDate').value=today;
  document.getElementById('updated').value=new Date().toLocaleString('ar-EG');
  try{ const u=JSON.parse(localStorage.getItem('logged_user')||'{}'); if(u.name) document.getElementById('createdBy').value=`Admin - ${u.name}`; }catch{}
  loadEmployees();
  loadExisting();
  ['nationalId','bankCode','empName','defaultPage','allowed','denied','reason','role','type','active','startDate','endDate'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', updatePreview); if(el) el.addEventListener('change', updatePreview); });
};
</script>
</body>
</html>
