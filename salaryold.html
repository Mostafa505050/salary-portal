<style>
*{box-sizing:border-box;font-family:'Cairo',Tahoma;margin:0;padding:0}
body{ background: #8b7a62; background-image: radial-gradient(800px 400px at 20% 10%, rgba(255,251,243,0.28), transparent 60%), radial-gradient(600px 400px at 90% 80%, rgba(60,50,35,0.28), transparent 60%); padding:12px; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
.top-strip{ width:100%; max-width:900px; background: linear-gradient(180deg, rgba(255,251,243,0.55), rgba(255,251,243,0.25)); backdrop-filter: blur(20px); border:1px solid rgba(120,100,80,0.25); border-right:6px solid #7a6652; border-radius:16px; padding:10px 14px; display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.main-card{ width:100%; max-width:900px; background: linear-gradient(180deg, rgba(255,251,243,0.48), rgba(255,251,243,0.22)); backdrop-filter: blur(22px); border:1px solid rgba(120,100,80,0.22); border-radius:18px; padding:16px; }
.row-2{display:flex;gap:8px;margin-bottom:8px}.row-2>div{flex:1}
.row-emp{display:flex;gap:8px;margin-bottom:12px}
.emp-search{flex:0 0 70%!important;width:70%!important}
.emp-code{flex:0 0 30%!important;max-width:calc(30% - 8px)!important}
.inline-field{display:flex;align-items:center;gap:6px}.inline-field label{font-size:11px;font-weight:800;min-width:45px;color:#4a3f32}
.input-3d,.select-trigger{ width:100%;padding:10px 12px;border-radius:12px; border:1.5px solid rgba(120,100,80,0.25); background: rgba(255,251,243,0.85); color:#3a2f24; font-size:12px;font-weight:700; outline:none; }
.btn-3d{ padding:10px 14px;border-radius:12px;border:none;color:#fff;font-weight:800;cursor:pointer; box-shadow: 0 6px 0 rgba(60,50,35,0.2), 0 10px 20px rgba(60,50,35,0.15); transition:.12s; }
.btn-3d:active{ transform: translateY(6px); box-shadow:none}
.btn-print{background:linear-gradient(180deg,#8a7a65,#5a4d3d);color:#fff;flex:1}
.btn-whats{background:linear-gradient(180deg,#25D366,#128C7E);flex:1}
.btn-back{background:linear-gradient(180deg,#6b5e4d,#3f362b)}
.custom-select{position:relative}.select-trigger{cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.select-panel{position:absolute;top:110%;left:0;right:0;z-index:99;background: #fdf8ef; border:1px solid #c9b99f;border-radius:12px;display:none;max-height:320px;overflow:hidden;box-shadow:0 15px 35px rgba(60,50,35,.35)}
.select-panel.open{display:block}.options{max-height:260px;overflow:auto}.option{padding:9px 10px;display:flex;justify-content:space-between;font-size:12px;cursor:pointer;border-bottom:1px solid rgba(120,100,80,0.12);color:#3a2f24;font-weight:700}.option:hover{background: rgba(168,152,128,0.22)}
.result-wrapper{width:100%;max-width:900px;margin:0 auto;display:none;margin-top:12px}
.loader{display:none;text-align:center;color:#4a3f32;font-weight:800;margin:10px;background: rgba(255,251,243,0.7); padding:10px;border-radius:12px;border:1px solid rgba(120,100,80,0.25)}
#printArea{background:#fff!important;border:2px solid #000;border-radius:10px;padding:6px;width:100%;max-width:900px;margin:0 auto;box-sizing:border-box;font-weight:700; transition: all .2s ease;}
.actions{display:flex;gap:8px;max-width:900px;margin:0 auto 8px auto;width:100%}
.controls-panel{width:100%;max-width:900px;background: rgba(255,251,243,0.68); backdrop-filter:blur(18px); border:1px solid rgba(120,100,80,0.25);border-radius:14px;padding:0;display:none;flex-direction:column;gap:0;margin-bottom:10px; overflow:hidden; box-shadow: 0 10px 30px rgba(60,50,35,0.15);}
.controls-panel.show{display:flex}
.controls-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(122,102,82,0.12);border-bottom:1px solid rgba(120,100,80,0.18);cursor:pointer}
.controls-body{padding:12px;display:flex;flex-direction:column;gap:12px}
.controls-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.control-item{display:flex;align-items:center;gap:6px;background:rgba(255,251,243,0.8);border:1px solid rgba(120,100,80,0.18);padding:6px 10px;border-radius:10px}
.control-item label{font-size:11px;font-weight:800;color:#4a3f32}
.control-item input[type="number"]{width:60px;padding:4px 6px;border-radius:6px;border:1px solid rgba(120,100,80,0.3);background:#fff;color:#3a2f24;font-weight:800;font-size:12px;text-align:center}

}

<body>

<div class="top-strip no-print">
  <img src="https://upload.wikimedia.org/wikipedia/ar/archive/8/85/20231203193514%21%D8%A7%D9%84%D8%B4%D8%B1%D9%83%D8%A9_%D8%A7%D9%84%D9%82%D8%A7%D8%A8%D8%B6%D8%A9_%D9%84%D9%83%D9%87%D8%B1%D8%A8%D8%A7%D8%A1_%D9%85%D8%B5%D8%B1.png" style="width:38px">
  <div><b style="font-size:13px;color:#3a2f24">مفردات مرتب - الربط الصحيح</b><div style="font-size:10px;color:rgba(58,47,36,0.7)">الكود_البنكى (موظفين_مرتبات) = emptid (مرتبات_شهرية)</div></div>
  <div style="margin-right:auto;display:flex;align-items:center;gap:6px">
    <div id="countInfo" style="font-size:10px;background:rgba(122,102,82,0.15);border:1px solid rgba(122,102,82,0.3);padding:5px 10px;border-radius:999px;font-weight:800;color:#4a3f32">0 موظف</div>

<div id="searchCard" class="main-card no-print">
<div class="row-2"><div class="inline-field"><label>📅 السنة:</label><select id="yearSelect" class="input-3d"><option>2024</option><option>2025</option><option selected>2026</option></select></div><div class="inline-field"><label>📆 الشهر:</label><select id="monthSelect" class="input-3d"><option value="1">يناير</option><option value="2">فبراير</option><option value="3">مارس</option><option value="4">أبريل</option><option value="5">مايو</option><option value="6">يونيو</option><option value="7">يوليو</option><option value="8">أغسطس</option><option value="9">سبتمبر</option><option value="10">أكتوبر</option><option value="11">نوفمبر</option><option value="12">ديسمبر</option></select></div></div>
<div class="row-emp"><div class="emp-search"><div style="font-size:10px;font-weight:800;margin-bottom:4px;color:#4a3f32">📝 الموظف (الكود_البنكى = emptid):</div><div class="custom-select" id="empCustomSelect"><div class="select-trigger" id="selectTrigger" onclick="togglePanel()"><span id="triggerText">-- اختر الموظف --</span><span>▾</span></div><div class="select-panel" id="selectPanel"><div style="padding:6px"><input id="empSearchBox" class="input-3d" placeholder="بحث بالاسم أو الكود_البنكى..." oninput="filterEmp()"></div><div class="options" id="optionsList"></div></div></div></div><div class="emp-code inline-field"><label>👤 الكود:</label><input id="empCodeInput" class="input-3d" readonly></div></div>
<button class="btn-3d" style="background:linear-gradient(180deg,#7a6652,#4a3f32);color:#fff;width:100%;height:46px;font-size:14px" onclick="executeSearch()">🔍 عرض الاستمارة - emptid = الكود_البنكى</button>
</div>

<div id="loader" class="loader no-print">⏳ جاري التحميل... <span id="loadCounter" style="background:#7a6652;color:#fff;padding:3px 12px;border-radius:999px;font-size:13px;margin-right:8px">٠ ث</span></div>
<div id="displayArea" class="result-wrapper"></div>

<script>
const WORKER_BASE_URL = "https://turso-api.mostafa-voic77729.workers.dev";
function toArabicDigits(str){ if(str===null||str===undefined) return ""; var map={'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'}; return String(str).replace(/[0-9]/g,d=>map[d]); }

let currentFontSize = parseInt(localStorage.getItem('fontSize')||'12');
let currentWidth = parseInt(localStorage.getItem('printWidth')||'100');
let colWidths = JSON.parse(localStorage.getItem('colWidths')||'{"notes":30,"amt1":10,"data1":40,"amt2":10,"data2":40}');
let showNotes = localStorage.getItem('showNotes') !== 'false'; // default true
let hideSignatures = localStorage.getItem('hideSignatures') === 'true'; // default false

let uniqueEmployees=[];
let lastData=null;

const monthNameMap = {"1":"يناير","2":"فبراير","3":"مارس","4":"ابريل","5":"مايو","6":"يونيو","7":"يوليو","8":"اغسطس","9":"سبتمبر","10":"اكتوبر","11":"نوفمبر","12":"ديسمبر"};

async function loadEmployees(){
  try{
    const res = await fetch(`${WORKER_BASE_URL}/api/employees-turso`);
    const j = await res.json();
    let data = j.employees || [];
    uniqueEmployees=data.map(r=>({
      code: String(r.code || "").trim(),
      name: String(r.name || "").trim(),
      national_id: r.national_id || ""
    })).filter(e=>e.code && e.name);
    const seen=new Set();
    uniqueEmployees=uniqueEmployees.filter(e=>{ if(seen.has(e.code)) return false; seen.add(e.code); return true; });
    uniqueEmployees.sort((a,b)=> a.name.localeCompare(b.name,'ar'));
    populate(uniqueEmployees);
  }catch(e){
    document.getElementById("countInfo").innerText="خطأ - اكتب الكود";
    document.getElementById("empCodeInput").removeAttribute("readonly");
  }
}

function populate(list){
  var c=document.getElementById('optionsList'); c.innerHTML="";
  list.slice(0,800).forEach(emp=>{
    var d=document.createElement('div'); d.className='option';
    d.innerHTML='<span>'+emp.name+'</span><small style="background:#7a6652;color:#fff;padding:2px 6px;border-radius:6px">'+toArabicDigits(emp.code)+' = emptid</small>';
    d.onclick=()=>{
      document.getElementById('empCodeInput').value=toArabicDigits(emp.code);
      document.getElementById('triggerText').textContent=emp.name+' - '+toArabicDigits(emp.code);
      document.getElementById('empCodeInput').dataset.emptid=emp.code;
      document.getElementById('empCodeInput').dataset.empname=emp.name;
      closePanel();
    };
    c.appendChild(d);
  });
  document.getElementById('countInfo').textContent=toArabicDigits(list.length)+' موظف (الكود_البنكى=emptid)';
}
function filterEmp(){
  var t=document.getElementById('empSearchBox').value.toLowerCase();
  var f=t? uniqueEmployees.filter(e=>e.name.toLowerCase().indexOf(t)>-1||e.code.indexOf(t)>-1) : uniqueEmployees;
  populate(f);
}
function togglePanel(){document.getElementById('selectPanel').classList.toggle('open')}
function closePanel(){document.getElementById('selectPanel').classList.remove('open')}
function toggleSearch(s){document.getElementById('searchCard').style.display=s?'block':'none'; if(s) document.getElementById('displayArea').style.display='none';}

let loadTimer=null;
function startLoadCounter(){ document.getElementById('loader').style.display='block'; let sec=0; loadTimer=setInterval(()=>{sec++; document.getElementById('loadCounter').textContent=toArabicDigits(sec)+' ث';},1000); }
function stopLoadCounter(){ clearInterval(loadTimer); document.getElementById('loader').style.display='none'; }

async function executeSearch(){
  var codeEl=document.getElementById('empCodeInput');
  var emptid=codeEl.dataset.emptid || codeEl.value.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  emptid = String(emptid).trim();
  if(!emptid){ alert('اختر الموظف'); return; }
  var year=document.getElementById('yearSelect').value;
  var monthNum=document.getElementById('monthSelect').value;
  var monthArabic = monthNameMap[monthNum] || monthNum;

  toggleSearch(false); startLoadCounter();
  try{
    const url = `${WORKER_BASE_URL}/api/salary-turso?year=${encodeURIComponent(year)}&month=${encodeURIComponent(monthArabic)}&code=${encodeURIComponent(emptid)}`;
    const res = await fetch(url);
    const j = await res.json();
    stopLoadCounter();
    if(!res.ok || !j.found){
      document.getElementById('displayArea').style.display='block';
      document.getElementById('displayArea').innerHTML=`<div style="background:#fff;padding:20px;text-align:center;color:#7a0000;font-weight:800;border-radius:12px">❌ لا يوجد مرتب<br>السنه: ${toArabicDigits(year)} - الشهر: ${monthArabic} - emptid (الكود_البنكى): ${toArabicDigits(emptid)}<br><br>${j.msg||''}</div><div class="no-print" style="text-align:center;margin-top:10px"><button class="btn-3d btn-back" onclick="toggleSearch(true)">↩ رجوع</button></div>`;
      return;
    }
    renderForm(j.data);
  }catch(err){
    stopLoadCounter();
    alert("خطأ: "+err.message);
    toggleSearch(true);
  }
}

function getFormHtmlJS(real_emp_name, emp_code_val, financial_year_val, month_val, bankName, accountNum, table_rows_html){
  return `<div id="printArea" style="font-size:${currentFontSize}px;width:${currentWidth}%">
    <div style="display:flex;align-items:center;gap:8px;width:100%;border:2px solid #000;border-radius:8px;background:#fff;padding:4px;margin-bottom:6px;height:80px">
      <img src="https://upload.wikimedia.org/wikipedia/ar/8/85/%D8%A7%D9%84%D8%B4%D8%B1%D9%83%D8%A9_%D8%A7%D9%84%D9%82%D8%A7%D8%A8%D8%B6%D8%A9_%D9%84%D9%83%D9%87%D8%B1%D8%A8%D8%A7%D8%A1_%D9%85%D8%B5%D8%B1.png" style="width:150px;height:70px;object-fit:contain;background:#fff;border:1px solid #ddd;border-radius:6px;padding:2px;flex-shrink:0">
      <div style="flex:1;text-align:center;font-size:${currentFontSize+2}px;font-weight:800;white-space:nowrap">نموذج مفردات مرتب غير قابلة للصرف - شركة مصر الوسطى لنقل الكهرباء</div>
    </div>
    <div style="text-align:center;padding:4px;border:1px solid #000;border-radius:6px;background:#fff;margin-bottom:4px;white-space:nowrap"><span style="font-size:${currentFontSize+1}px;font-weight:900;color:#7f0000">👤 اسم الموظف: ${real_emp_name} - الكود_البنكى/emptid: ${toArabicDigits(emp_code_val)}</span></div>
    <table style="width:100%;border-collapse:collapse;font-size:${currentFontSize}px;font-weight:700;margin-bottom:4px;table-layout:fixed"><tr><td style="border:1px solid #000;padding:3px;text-align:center;background:#fffde7">السنة المالية: ${toArabicDigits(financial_year_val)} -- بيان شهر: ${toArabicDigits(month_val)}</td><td style="border:1px solid #000;padding:3px;text-align:center;background:#fce4ec">كود الموظف (emptid) ${toArabicDigits(emp_code_val)}</td></tr><tr><td style="border:1px solid #000;padding:3px;text-align:center;background:#e3f2fd">جهة الصرف: ${bankName?bankName:'--'}</td><td style="border:1px solid #000;padding:3px;text-align:center;background:#f3e5f5">رقم الحساب: ${toArabicDigits(accountNum)}</td></tr></table>
    <table id="mainSalaryTable" style="width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed"><tr>
      <td id="notesCol" class="notes-col" style="width:${colWidths.notes}%;border:1px solid #000;border-radius:6px;vertical-align:top;padding:5px;background:#fff;${showNotes?'':'display:none'}"><div style="text-align:center;background:#fff176;border:1px solid #000;border-radius:4px;padding:4px;margin-bottom:6px;font-weight:900">بيان مفردات مرتب</div>للسيد/ <b style="color:#b71c1c">${real_emp_name}</b><br><br><span style="font-size:${currentFontSize-2}px">1- قد أعطيت هذه المفردات بناء على طلب المذكور دون أدنى مسئولية على الشركة.<br>2- الشركة غير مسئولة تجاه البنك عن أية قروض تمنح للعامل بناء على هذه المفردات.<br>3- الشركة غير مسئولة عن سداد أية مديونيات.</span></td>
      <td id="spacerCol" style="width:1%;${showNotes?'':'display:none'}"></td>
      <td style="width:${showNotes ? (99-colWidths.notes) : 100}%;vertical-align:top;border:1px solid #000;border-radius:6px;overflow:hidden">
        <table style="width:100%;border-collapse:collapse;text-align:center;font-weight:700;table-layout:fixed">
          <colgroup><col id="col_amt1" style="width:${colWidths.amt1}%"><col id="col_data1" style="width:${colWidths.data1}%"><col id="col_amt2" style="width:${colWidths.amt2}%"><col id="col_data2" style="width:${colWidths.data2}%"></colgroup>
          <thead><tr><th colspan="2" style="background:#b71c1c;color:#fff;border:1px solid #000;padding:5px">الإستحقاقات</th><th colspan="2" style="background:#b71c1c;color:#fff;border:1px solid #000;padding:5px">المستقطع</th></tr><tr style="background:#e8f5e9"><th style="border:1px solid #000;padding:4px">المبلغ</th><th style="border:1px solid #000;padding:4px">البيانات</th><th style="border:1px solid #000;padding:4px">المبلغ</th><th style="border:1px solid #000;padding:4px">البيانات</th></tr></thead>
          <tbody style="background:#fff">${table_rows_html}</tbody>
        </table>
      </td></tr></table>
    <table id="signaturesTable" style="width:100%;border-collapse:collapse;margin-top:6px;font-size:${currentFontSize-1}px;font-weight:800;table-layout:fixed">
      <tr id="sigHeaderRow"><td style="width:25%;border:1px solid #000;padding:5px;text-align:center;background:#fffde7">مسئول الإستحقاقات</td><td style="width:25%;border:1px solid #000;padding:5px;text-align:center;background:#e8f5e9">رئيس الشئون الإدارية</td><td style="width:25%;border:1px solid #000;padding:5px;text-align:center;background:#e3f2fd">مدير عام شبكات بنى سويف</td><td style="width:25%;border:none"></td></tr>
      <tr id="sigBodyRow"><td class="sig-cell" style="border:1px solid #000;height:55px;padding:4px;vertical-align:top">توقيع / <div style="text-align:center;margin-top:18px">------</div></td><td class="sig-cell" style="border:1px solid #000;height:55px;padding:4px;vertical-align:top">محاسب /<div style="text-align:center;margin-top:18px;color:#b71c1c">إبراهيم محمد سعيد</div></td><td class="sig-cell" style="border:1px solid #000;height:55px;padding:4px;vertical-align:top">مهندس /<div style="text-align:center;margin-top:18px;color:#0d47a1">سيد محمد عبد الحفيظ</div></td><td id="devCell" style="border:none;padding:4px;text-align:left;line-height:1.2"><span style="font-size:9px">إعداد وتطوير</span><br><b style="font-size:10px">أ/ مصطفى درويش</b><br><span style="font-size:9px">📱 ${toArabicDigits("01092259655")}</span></td></tr>
    </table>
  </div>`;
}

function renderForm(row){
  lastData=row;
  var area=document.getElementById('displayArea'); area.style.display='block';
  let allKeys = Object.keys(row);
  let startIdx = allKeys.findIndex(k => k.includes("مرتب_اساسي") || k.includes("مرتب اساسي"));
  let midIdx = allKeys.findIndex(k => k.includes("أجمالى_المستحق") || k.includes("اجمالى_المستحق") || k.includes("اجمالي_المستحق"));
  let endIdx = allKeys.findIndex(k => k.includes("الصافى") || k.includes("الصافي"));

  let instKeys, mustKeys, safyKey;
  if(startIdx!==-1 && midIdx!==-1){
    instKeys = allKeys.slice(startIdx, midIdx+1);
    if(endIdx!==-1){ mustKeys = allKeys.slice(midIdx+1, endIdx); safyKey = allKeys[endIdx]; }
    else mustKeys = allKeys.slice(midIdx+1);
  } else {
    const meta = ["السنه","الشهر","كود_العامل","الاسم","emptid","id","م","اسم_البنك_المحول_و_الفرع_المحول_اليه","رقم_الحساب_البنكى","كود_البنك","كود_القسم"];
    let filtered = allKeys.filter(k=>!meta.includes(k) && row[k]!=null && row[k]!="" && !isNaN(parseFloat(row[k])));
    let mid = filtered.findIndex(k=>k.includes("المستحق"));
    if(mid!==-1){ instKeys=filtered.slice(0,mid+1); mustKeys=filtered.slice(mid+1); }
    else { instKeys=filtered.slice(0, Math.ceil(filtered.length/2)); mustKeys=filtered.slice(Math.ceil(filtered.length/2)); }
    let sIdx = filtered.findIndex(k=>k.includes("الصافى")||k.includes("الصافي"));
    if(sIdx!==-1){ safyKey=filtered[sIdx]; mustKeys=mustKeys.filter(k=>k!==safyKey); }
  }

  let inst=[], must=[];
  (instKeys||[]).forEach(k=>{
    let v=row[k]; if(v!==null && v!=="" && !isNaN(parseFloat(v)) && parseFloat(v)!=0){
      inst.push({key: k.replace(/_/g," "), val: parseFloat(v).toFixed(2)});
    }
  });
  (mustKeys||[]).forEach(k=>{
    let v=row[k]; if(v!==null && v!=="" && !isNaN(parseFloat(v)) && parseFloat(v)!=0){
      must.push({key: k.replace(/_/g," "), val: parseFloat(v).toFixed(2)});
    }
  });

  var max=Math.max(inst.length, must.length);
  var rowsHtml="";
  for(var i=0;i<max;i++){
    var a=inst[i]||{key:"",val:""}; var b=must[i]||{key:"",val:""};
    rowsHtml+=`<tr style="height:24px"><td style="border:1px solid #000;padding:2px 3px;text-align:center;font-size:${currentFontSize}px">${a.val?toArabicDigits(a.val):""}</td><td style="border:1px solid #000;padding:2px 6px;text-align:right;font-size:${currentFontSize}px">${a.key}</td><td style="border:1px solid #000;padding:2px 3px;text-align:center;font-size:${currentFontSize}px">${b.val?toArabicDigits(b.val):""}</td><td style="border:1px solid #000;padding:2px 6px;text-align:right;font-size:${currentFontSize}px">${b.key}</td></tr>`;
  }
  let safyVal = safyKey ? row[safyKey] : (row["الصافى"] || row["الصافي"]);
  if(safyVal){
    rowsHtml+=`<tr><td colspan="2" style="border:2px solid #000;padding:5px;text-align:center;font-weight:900;background:#fff9c4">الصافي</td><td colspan="2" style="border:2px solid #000;padding:5px;text-align:center;font-weight:900;background:#fff176;color:#b71c1c;font-size:${currentFontSize+2}px">${toArabicDigits(parseFloat(safyVal).toFixed(2))}</td></tr>`;
  }
  var empName = row["الاسم"] || "";
  var empCode = row["emptid"] || row["كود_العامل"] || "";
  var finYear = row["السنه"] || "";
  var monVal = row["الشهر"] || "";
  var bankName = row["اسم_البنك_المحول_و_الفرع_المحول_اليه"] || "";
  var accNum = row["رقم_الحساب_البنكى"] || "";
  var formHtml=getFormHtmlJS(empName, empCode, finYear, monVal, bankName, accNum, rowsHtml);

  // بناء فريم إعدادات العرض القابل للطي
  area.innerHTML=`
    <div class="no-print" style="max-width:900px;margin:0 auto 6px;display:flex;gap:6px">
      <button class="btn-3d" style="flex:1;background:linear-gradient(180deg,rgba(255,251,243,0.8),rgba(255,251,243,0.4));border:1px solid rgba(120,100,80,0.3);color:#4a3f32" onclick="toggleSettingsFrame()">⚙ إعدادات العرض ▾</button>
      <button class="btn-3d btn-back" onclick="toggleSearch(true)">↩ رجوع</button>
    </div>

    <div id="settingsFrame" class="no-print controls-panel show">
      <div id="settingsBody" class="controls-body">
        
        <div class="controls-row" style="gap:6px">
          <div class="control-item">
            <input type="checkbox" id="chkShowNotes" ${showNotes?'checked':''} onchange="toggleNotes(this.checked)">
            <label for="chkShowNotes">📝 إظهار الملاحظات</label>
          </div>
          <div class="control-item">
            <input type="checkbox" id="chkHideSignatures" ${hideSignatures?'checked':''} onchange="toggleSignatures(this.checked)">
            <label for="chkHideSignatures">✍ إخفاء التوقيعات (يبقى إعداد وتطوير)</label>
          </div>
          <div class="control-item">
            <label>🔍 حجم الخط:</label>
            <input type="number" id="inputFontSize" min="8" max="20" value="${currentFontSize}" oninput="changeFontSize(this.value)">
            <span style="font-size:10px">px</span>
          </div>
          <div class="control-item">
            <label>↔ عرض الاستمارة:</label>
            <input type="number" id="inputWidth" min="70" max="120" value="${currentWidth}" oninput="changeWidth(this.value)">
            <span style="font-size:10px">%</span>
          </div>
        </div>

        <div class="controls-row">
          <div class="control-item"><label>ملاحظات:</label><input type="number" id="w_notes" min="0" max="60" value="${colWidths.notes}" oninput="changeColWidth('notes',this.value)"><span style="font-size:9px">%</span></div>
          <div class="control-item"><label>مبلغ 1:</label><input type="number" id="w_amt1" min="5" max="25" value="${colWidths.amt1}" oninput="changeColWidth('amt1',this.value)"><span style="font-size:9px">%</span></div>
          <div class="control-item"><label>بيان 1:</label><input type="number" id="w_data1" min="10" max="60" value="${colWidths.data1}" oninput="changeColWidth('data1',this.value)"><span style="font-size:9px">%</span></div>
          <div class="control-item"><label>مبلغ 2:</label><input type="number" id="w_amt2" min="5" max="25" value="${colWidths.amt2}" oninput="changeColWidth('amt2',this.value)"><span style="font-size:9px">%</span></div>
          <div class="control-item"><label>بيان 2:</label><input type="number" id="w_data2" min="10" max="60" value="${colWidths.data2}" oninput="changeColWidth('data2',this.value)"><span style="font-size:9px">%</span></div>
        </div>

        <div class="controls-row">
          <button class="btn-3d" style="background:linear-gradient(180deg,#9c8c7a,#6b5e4d);flex:1" onclick="saveSettings()">💾 حفظ الإعدادات</button>
          <button class="btn-3d btn-back" style="flex:1" onclick="resetSettings()">↺ افتراضي</button>
        </div>

      </div>
    </div>

    <div class="no-print actions"><button class="btn-3d btn-print" onclick="printOnePage()">🖨 طباعة صفحة واحدة</button><button class="btn-3d btn-whats" onclick="downloadImage()">📤 تحميل صورة</button></div>
    ${formHtml}<br>`;

  // تطبيق الحالات المحفوظة بعد الرسم
  applyVisibility();
}

function toggleSettingsFrame(){
  const frame = document.getElementById('settingsFrame');
  const body = document.getElementById('settingsBody');
  const btn = document.querySelector('button[onclick="toggleSettingsFrame()"]');
  if(!body || !frame) return;
  const isHidden = body.style.display==='none';
  if(isHidden){
    body.style.display='flex';
    frame.classList.add('show');
    if(btn) btn.innerHTML='⚙ إعدادات العرض ▴';
  }else{
    body.style.display='none';
    frame.classList.remove('show');
    if(btn) btn.innerHTML='⚙ إعدادات العرض ▾';
  }
}

function toggleNotes(checked){
  showNotes = checked;
  localStorage.setItem('showNotes', showNotes);
  applyVisibility();
}
function toggleSignatures(checked){
  hideSignatures = checked;
  localStorage.setItem('hideSignatures', hideSignatures);
  applyVisibility();
}

function applyVisibility(){
  const notesCol = document.getElementById('notesCol');
  const spacerCol = document.getElementById('spacerCol');
  const sigHeader = document.getElementById('sigHeaderRow');
  const sigBody = document.getElementById('sigBodyRow');
  if(notesCol) notesCol.style.display = showNotes ? '' : 'none';
  if(spacerCol) spacerCol.style.display = showNotes ? '' : 'none';
  // تعديل عرض الجدول الرئيسي
  const mainTable = document.getElementById('mainSalaryTable');
  if(mainTable){
    const tds = mainTable.querySelectorAll('tr > td');
    if(tds.length>=3){
      tds[2].style.width = showNotes ? (99-colWidths.notes)+'%' : '100%';
    }
  }
  // التوقيعات
  if(sigHeader && sigBody){
    const sigCells = sigBody.querySelectorAll('.sig-cell');
    const headerCells = sigHeader.querySelectorAll('td');
    if(hideSignatures){
      sigCells.forEach(c=>c.style.display='none');
      if(headerCells[0]) headerCells[0].style.display='none';
      if(headerCells[1]) headerCells[1].style.display='none';
      if(headerCells[2]) headerCells[2].style.display='none';
      // يبقى فقط إعداد وتطوير
    }else{
      sigCells.forEach(c=>c.style.display='');
      headerCells.forEach(c=>c.style.display='');
    }
  }
}

function changeFontSize(val){
  currentFontSize = parseInt(val)||12;
  localStorage.setItem('fontSize', currentFontSize);
  const pa = document.getElementById('printArea');
  if(pa) pa.style.fontSize = currentFontSize+'px';
  // إعادة الرسم لتحديث الأحجام الداخلية
  if(lastData) renderForm(lastData);
}
function changeWidth(val){
  currentWidth = parseInt(val)||100;
  localStorage.setItem('printWidth', currentWidth);
  const pa = document.getElementById('printArea');
  if(pa) pa.style.width = currentWidth+'%';
}
function changeColWidth(key,val){
  colWidths[key]=parseInt(val)||10;
  localStorage.setItem('colWidths', JSON.stringify(colWidths));
  if(lastData) renderForm(lastData);
}

function saveSettings(){
  localStorage.setItem('fontSize', currentFontSize);
  localStorage.setItem('printWidth', currentWidth);
  localStorage.setItem('colWidths', JSON.stringify(colWidths));
  localStorage.setItem('showNotes', showNotes);
  localStorage.setItem('hideSignatures', hideSignatures);
  alert('✅ تم حفظ الإعدادات');
}
function resetSettings(){
  localStorage.removeItem('fontSize');
  localStorage.removeItem('printWidth');
  localStorage.removeItem('colWidths');
  localStorage.removeItem('showNotes');
  localStorage.removeItem('hideSignatures');
  currentFontSize=12; currentWidth=100; colWidths={notes:30,amt1:10,data1:40,amt2:10,data2:40}; showNotes=true; hideSignatures=false;
  if(lastData) renderForm(lastData);
}

// طباعة صفحة واحدة فقط مهما كانت البيانات
function printOnePage(){
  const printArea = document.getElementById('printArea');
  if(!printArea) return;
  
  // احسب الارتفاع المطلوب لـ A4 (حوالي 1123px في 96dpi مع هوامش)
  const a4Height = 1050; // بالبيكسل تقريبا
  const contentHeight = printArea.scrollHeight;
  
  if(contentHeight > a4Height){
    const scale = a4Height / contentHeight;
    // طبق تصغير مؤقت للطباعة فقط
    const style = document.createElement('style');
    style.id='printScaleStyle';
    style.innerHTML=`@media print{ #printArea{ transform: scale(${scale}); transform-origin: top center; height: ${a4Height}px; } }`;
    document.head.appendChild(style);
    
    window.print();
    
    // احذف الـ style بعد الطباعة
    setTimeout(()=>{ const s=document.getElementById('printScaleStyle'); if(s) s.remove(); }, 1000);
  }else{
    window.print();
  }
}

async function downloadImage(){
  let area=document.getElementById('printArea');
  let canvas=await html2canvas(area,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
  let link=document.createElement('a');
  link.download=`مرتب-${lastData["الاسم"]||""}-${lastData["الشهر"]||""}.png`;
  link.href=canvas.toDataURL('image/png');
  link.click();
}

window.onload=()=>{ loadEmployees(); document.addEventListener('click',e=>{ if(!document.getElementById('empCustomSelect').contains(e.target)) closePanel(); }); };
</script>
