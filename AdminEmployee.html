<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>HR V4 - البحث التلقائي عن العناوين</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.42.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family:Cairo,sans-serif;background:#0f172a;color:#fff;padding:20px}
.card{background:#1e293b;border-radius:16px;padding:20px;max-width:1000px;margin:auto}
.btn{width:100%;padding:14px;background:#0ea5e9;color:#fff;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:10px;font-size:16px}
.log{background:#020617;border-radius:10px;padding:12px;height:400px;overflow:auto;font-size:11px;white-space:pre-wrap;border:1px solid #334155}
.stat{display:flex;gap:8px;margin:10px 0}
.stat div{flex:1;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:8px;text-align:center}
.fill{height:10px;background:#22c55e;width:0%;transition:.3s}
.bar{height:10px;background:#334155;border-radius:10px;overflow:hidden}
</style>
</head>
<body>
<div class="card">
<h2>✅ V4 - بيكتشف عنوان الرقم القومي تلقائياً</h2>
<input type="file" id="fileInput" accept=".xlsx,.xls">
<div class="stat">
<div><b id="tot">0</b>إجمالي</div><div><b id="val">0</b>صالح</div><div><b id="done">0</b>تم</div><div><b id="fail">0</b>فشل</div>
</div>
<div class="bar"><div id="fill" class="fill"></div></div>
<button id="uploadBtn" class="btn" disabled>اختر الملف أولاً</button>
<div id="log" class="log"></div>
</div>
<script>
const supa = supabase.createClient("https://fmgtrtudpardxsvjbcve.supabase.co","sb_publishable_w3Mdg-WdxcmXNk03fj45KA_Ol6MLulH");
let rows=[];
const logEl=document.getElementById("log");
function log(t){ logEl.textContent+="\n"+t; logEl.scrollTop=99999; }

const map={
"الكود البنكى":"emp_code","الكود البنكي":"emp_code","اسم العامل":"emp_name","الاسم":"emp_name",
"الرقم القومى":"national_id","الرقم القومي":"national_id","الرقم القومى":"national_id",
"WhatsUpp":"whatsapp","phone":"phone","الوظيفه الحاليه":"current_job","الوظيفة الحالية":"current_job",
"الدرجة":"degree","المؤهل":"qualification","الموهل":"qualification"
};

document.getElementById("fileInput").onchange=async e=>{
 const file=e.target.files[0]; if(!file) return;
 log(`📂 ${file.name} ${(file.size/1024/1024).toFixed(2)} MB`);
 const buf=await file.arrayBuffer();
 const wb=XLSX.read(buf,{type:'array'});
 const ws=wb.Sheets[wb.SheetNames[0]];
 // اقرأ كـ array of arrays عشان نلاقي صف العناوين
 const aoa = XLSX.utils.sheet_to_json(ws,{header:1, defval:""});
 log(`📄 عدد الصفوف الخام: ${aoa.length}`);
 // دور على الصف اللي فيه "الرقم القومى"
 let headerRowIdx=-1;
 for(let i=0;i<Math.min(10, aoa.length);i++){
   const rowStr=aoa[i].join(" ");
   if(rowStr.includes("الرقم") && rowStr.includes("القوم")){
     headerRowIdx=i; break;
   }
   if(rowStr.includes("اسم العامل")){
     headerRowIdx=i; break;
   }
 }
 if(headerRowIdx===-1){ headerRowIdx=0; log("⚠️ لم أجد صف عناوين واضح، بستخدم أول صف"); }
 else log(`✅ لقيت صف العناوين في الصف رقم ${headerRowIdx+1}: ${aoa[headerRowIdx].slice(0,15).join(" | ")}`);
 
 const headers=aoa[headerRowIdx].map(h=> String(h).trim()).filter(h=>h && !h.startsWith("__EMPTY"));
 log(`🔍 العناوين النضيفة: ${headers.join(" | ")}`);
 
 // حول باقي الصفوف لـ objects
 const dataRows=aoa.slice(headerRowIdx+1);
 const json=[];
 dataRows.forEach(r=>{
   let obj={};
   aoa[headerRowIdx].forEach((h, idx)=>{
     let cleanH=String(h).trim();
     if(!cleanH || cleanH.startsWith("__EMPTY")) return;
     let key=map[cleanH] || cleanH;
     obj[key]=r[idx];
   });
   // فقط لو فيه رقم قومي
   if(obj["national_id"] || obj["الرقم القومى"]){
     json.push(obj);
   }
 });
 
 document.getElementById("tot").innerText=dataRows.length;
 // تطبيع وفلترة
 rows=json.map(o=>{
   let n={};
   for(let k in o){ let kk=map[k]||k; n[kk]=o[k]; }
   return n;
 }).map(o=>({
   national_id: o.national_id? String(o.national_id).replace(/[^0-9]/g,'').trim(): "",
   emp_code: o.emp_code? String(o.emp_code).trim(): null,
   emp_name: o.emp_name||null,
   whatsapp: o.whatsapp? String(o.whatsapp).replace(/[^0-9]/g,'').trim(): null,
   phone: o.phone? String(o.phone).replace(/[^0-9]/g,'').trim(): null,
   current_job: o.current_job||null,
   degree: o.degree||null,
   qualification: o.qualification||null,
   in_service: true
 })).filter(r=> r.national_id.length>=10);
 
 document.getElementById("val").innerText=rows.length;
 log(`✅ الصالح للرفع: ${rows.length}`);
 if(rows.length>0){
   log(`مثال: ${rows[0].national_id} - ${rows[0].emp_name}`);
   document.getElementById("uploadBtn").disabled=false;
   document.getElementById("uploadBtn").innerText=`🚀 ابدأ رفع ${rows.length} موظف`;
 }else{
   log("❌ لسه 0 - انسخ أول 3 صفوف من الاكسيل وابعتهالي");
 }
};

document.getElementById("uploadBtn").onclick=async()=>{
 let done=0,fail=0;
 for(let i=0;i<rows.length;i++){
   try{
     const {error}=await supa.from("employees_full").upsert(rows[i],{onConflict:'national_id'});
     if(error) throw error;
     done++; document.getElementById("done").innerText=done;
     if(i<3 || i%30===0) log(`✅ ${done}: ${rows[i].emp_name}`);
   }catch(err){
     fail++; document.getElementById("fail").innerText=fail;
     log(`❌ ${rows[i].national_id}: ${err.message}`);
   }
   document.getElementById("fill").style.width=Math.round((i+1)/rows.length*100)+"%";
   if(i%15===0) await new Promise(r=>setTimeout(r,120));
 }
 log(`\n🎉 انتهى! ${done} نجح، ${fail} فشل`);
};
</script>
</body>
</html>
