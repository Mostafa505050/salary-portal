<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>رفع HR - حل مشكلة الـ 100</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>body{font-family:Cairo;background:#0f172a;color:white;padding:20px} .card{background:#1e293b;padding:20px;border-radius:16px;max-width:900px;margin:auto} .btn{width:100%;padding:14px;background:#0ea5e9;color:white;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:10px} .log{background:#020617;padding:10px;border-radius:10px;height:350px;overflow:auto;font-size:11px;white-space:pre-wrap;margin-top:12px} .bar{height:10px;background:#334155;border-radius:10px;overflow:hidden} .fill{height:100%;background:#22c55e;width:0%}</style>
</head>
<body>
<div class="card">
<h2>✅ حل مشكلة الـ 100 صف - رفع ذكي</h2>
<input type="file" id="f" accept=".xlsx,.xls">
<div class="bar" style="margin-top:12px"><div id="fill" class="fill"></div></div>
<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:13px">
<span>إجمالي: <b id="tot">0</b></span>
<span>صالح: <b id="val">0</b></span>
<span style="color:#22c55e">تم: <b id="done">0</b></span>
<span style="color:#f87171">فشل: <b id="fail">0</b></span>
</div>
<button id="btn" class="btn" disabled>ابدأ الرفع (يتخطى الأخطاء تلقائياً)</button>
<div id="log" class="log">في انتظار الملف...</div>
</div>
<script>
const URL="https://fmgtrtudpardxsvjbcve.supabase.co";
const KEY="sb_publishable_w3Mdg-WdxcmXNk03fj45KA_Ol6MLulH";
const supa=supabase.createClient(URL,KEY);
let rows=[];
const colMap={
"الكود البنكى":"emp_code","الكود البنكي":"emp_code","اسم العامل":"emp_name","الاسم":"emp_name","الرقم القومى":"national_id","الرقم القومي":"national_id","WhatsUpp":"whatsapp","WhatsApp":"whatsapp","واتساب":"whatsapp","phone":"phone","تليفون":"phone","في الخدمة":"in_service","فى الخدمة":"in_service","الموهل":"qualification","المؤهل":"qualification","الكود":"emp_code","الوظيفة":"current_job","الدرجة":"degree"
};
function log(t){document.getElementById("log").textContent+="\n"+t; document.getElementById("log").scrollTop=99999}
document.getElementById("f").onchange=async e=>{
 const file=e.target.files[0]; if(!file) return;
 const buf=await file.arrayBuffer();
 const wb=XLSX.read(buf,{type:'array'});
 const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
 document.getElementById("tot").innerText=json.length;
 // تطبيع
 rows=json.map(r=>{
   let o={}; for(let k in r){ let nk=colMap[k.trim()]||k.trim(); o[nk]=r[k]; }
   return o;
 }).filter(r=> r.national_id && String(r.national_id).length>=10);
 document.getElementById("val").innerText=rows.length;
 log(`تم قراءة ${json.length} - الصالح ${rows.length}`);
 document.getElementById("btn").disabled=false;
};
document.getElementById("btn").onclick=async()=>{
 let done=0,fail=0;
 for(let i=0;i<rows.length;i++){
   const r=rows[i];
   const payload={
     national_id:String(r.national_id).trim(),
     emp_code:r.emp_code?String(r.emp_code):null,
     emp_name:r.emp_name||null,
     whatsapp:r.whatsapp?String(r.whatsapp):null,
     phone:r.phone?String(r.phone):null,
     in_service:r.in_service?true:true,
     notes:r.notes||null,
     degree:r.degree||null,
     current_job:r.current_job||null,
     qualification:r.qualification||null,
   };
   // نحذف الفاضي
   Object.keys(payload).forEach(k=> { if(payload[k]===""||payload[k]==="undefined") payload[k]=null });
   try{
     const {error}=await supa.from("employees_full").upsert(payload,{onConflict:'national_id'});
     if(error) throw error;
     done++; document.getElementById("done").innerText=done;
     if(i%10==0) log(`✅ ${done} - ${payload.national_id} ${payload.emp_name}`);
   }catch(err){
     fail++; document.getElementById("fail").innerText=fail;
     log(`❌ فشل صف ${i+1} [${r.national_id}] ${r.emp_name}: ${err.message}`);
   }
   document.getElementById("fill").style.width=Math.round((i+1)/rows.length*100)+"%";
   await new Promise(r=>setTimeout(r, 80)); // تهدئة عشان Supabase المجاني
 }
 log(`\n🎉 انتهى! نجح: ${done} - فشل: ${fail}`);
 if(fail>0) log(`\nاللي فشل غالباً رقم قومي مكرر أو حروف في رقم. تقدر تنسخ اللوج ده وتبعتهولي أصلحهولك`);
};
</script>
</body>
</html>
