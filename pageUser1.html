<style>
*{font-family:'Cairo',sans-serif; box-sizing:border-box}
body{

}

  display:flex;

}
.top-strip h1{ font-size:22px; font-weight:900; margin:0; color:#000; line-height:1.3; text-align:center; width:100%; }
.code-badge{
  display:inline-flex;

  background:#fff;
  border:2px solid #000;

}
.btn-3d{
  height:40px;

  font-weight:800;

  display:inline-flex;

  justify-content:center;

}
.btn-logout{ background:#fff1f1; color:#b91c1c; box-shadow: 0 4px 0 #e8a0a0, 0 2px 0 #000; }
.btn-logout:active{ transform:translateY(3px); box-shadow: 0 1px 0 #e8a0a0, 0 1px 0 #000; }
.btn-nav{ background:linear-gradient(180deg,#ffffff,#f5e6c8); color:#000; box-shadow: 0 5px 0 #d2b48c, 0 3px 0 #000; min-width:88px; }
.btn-nav:active{ transform:translateY(3px); box-shadow: 0 2px 0 #d2b48c, 0 1px 0 #000; }

.displayArea{ margin-top:16px; }
.printArea-real{

}
/* خلفية مائية مائلة في منتصف الاستمارة */
.printArea-real::before{
  content: "غير قابلة للصرف \A ولا يعتمد كمستند رسمى";

}
.printArea-real > div{ position:relative; z-index:1; }
.actions{ display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; justify-content:center; }

.red-item{ color:#b71c1c !important; font-weight:900 !important; }
@media print{
  body{ background:#fff!important; }
  .no-print{ display:none!important; }

}

</div>

<script>
const WORKER_BASE_URL = "https://turso-api.mostafa-voic77729.workers.dev";

const monthNameMap = {
  1:"يناير", 2:"فبراير", 3:"مارس", 4:"أبريل", 5:"مايو", 6:"يونيو",
  7:"يوليو", 8:"أغسطس", 9:"سبتمبر", 10:"أكتوبر", 11:"نوفمبر", 12:"ديسمبر"
};

let currentMonth = new Date().getMonth() + 1;
let currentYear = new Date().getFullYear();
let lastData = null;
let loadTimer = null;

function toArabicDigits(str){
  if(str===null||str===undefined) return "";
  const map = {'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
  return String(str).replace(/[0-9]/g, d => map[d]);
}

function monthNumberToArabicName(num){
  return monthNameMap[num] || String(num);
}

// نفس الدوال بدون تعديل - مرتبطة بصفحة أخرى
function getEmpCodeFromHeader(){
  try{
    const v1 = localStorage.getItem('empCode');
    if(v1) return v1.trim();
    const v2 = localStorage.getItem('emptid');
    if(v2) return v2.trim();
    const logged = JSON.parse(localStorage.getItem('logged_user')||'{}');
    if(logged.code) return String(logged.code).trim();
    if(logged.emptid) return String(logged.emptid).trim();
    if(logged.id) return String(logged.id).trim();
  }catch(e){}
  const el = document.getElementById('headerCode');
  if(el){
    const txt = el.textContent||"";
    const m = txt.match(/[0-9A-Za-z]+/);
    if(m && m[0] !== "--") return m[0];
  }
  return "";
}

function getEmpNameFromHeader(){
  try{
    const logged = JSON.parse(localStorage.getItem('logged_user')||'{}');
    if(logged.name) return logged.name;
  }catch(e){}
  return "User";
}

function logout(){
  localStorage.clear();
  window.location.href='index.html';
}

// إصلاح مشكلة الانتقال ليناير: يبقى في نفس الشهر ولا ينتقل تلقائيا
function changeMonth(delta){
  // حفظ الشهر والسنة قبل التغيير
  let newMonth = currentMonth + delta;
  let newYear = currentYear;
  
  if(newMonth > 12){ newMonth = 1; newYear++; }
  if(newMonth < 1){ newMonth = 12; newYear--; }
  
  currentMonth = newMonth;
  currentYear = newYear;
  updateMonthLabels();
  executeSearch();
}

function updateMonthLabels(){
  const mEl = document.getElementById('currentMonthLabel');
  const yEl = document.getElementById('currentYearLabel');
  if(mEl) mEl.textContent = monthNameMap[currentMonth] || currentMonth;
  if(yEl) yEl.textContent = toArabicDigits(String(currentYear));
}

function startLoadCounter(){
  const l = document.getElementById('loader');
  if(l) l.style.display='block';
  let sec=0;
  loadTimer=setInterval(()=>{
    sec++;
    const c=document.getElementById('loadCounter');
    if(c) c.textContent = toArabicDigits(sec)+' ث';
  },1000);
}
function stopLoadCounter(){
  clearInterval(loadTimer);
  const l=document.getElementById('loader');
  if(l) l.style.display='none';
}

// نفس تصميم استمارة المرتب - تم إلغاء Header واسم الموظف وعمود الملاحظات والتوقيعات - تكبير الخط درجتين + علامة مائية
function getFormHtmlJS(real_emp_name, emp_code_val, financial_year_val, month_val, bankName, bankCode, table_rows_html, currentFontSize){
  // تكبير الخط درجتين: 12 -> 14
  currentFontSize = 14;
  return '<div style="font-size:'+currentFontSize+'px;width:100%">'
    + '<table style="width:100%;border-collapse:collapse;font-size:'+currentFontSize+'px;font-weight:700;margin-bottom:6px;table-layout:fixed"><tr><td class="nowrap-cell" style="border:1px solid #000;padding:5px;text-align:center;background:#fffde7;color:#000;white-space:nowrap">السنة المالية: '+toArabicDigits(financial_year_val)+' -- بيان شهر: '+toArabicDigits(month_val)+'</td><td class="nowrap-cell" style="border:1px solid #000;padding:5px;text-align:center;background:#fce4ec;color:#ff0000;font-weight:900;white-space:nowrap">كود الموظف: '+toArabicDigits(emp_code_val)+'</td></tr><tr><td class="nowrap-cell" style="border:1px solid #000;padding:5px;text-align:center;background:#e3f2fd;color:#000;white-space:nowrap">جهة الصرف: '+(bankName?bankName:'--')+'</td><td class="nowrap-cell" style="border:1px solid #000;padding:5px;text-align:center;background:#f3e5f5;color:#000;white-space:nowrap">رقم الحساب: '+toArabicDigits(bankCode)+'</td></tr></table>'
    + '<table id="mainSalaryTable" style="width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed"><tr>'
    + '<td style="width:100%;vertical-align:top;border:1px solid #000;border-radius:6px;overflow:hidden">'
    + '<table style="width:100%;border-collapse:collapse;text-align:center;font-weight:700;table-layout:fixed">'
    + '<colgroup><col style="width:13%"><col style="width:32%"><col style="width:13%"><col style="width:42%"></colgroup>'
    + '<thead><tr><th class="nowrap-cell" colspan="2" style="background:#b71c1c;color:#fff;border:1px solid #000;padding:6px;white-space:nowrap">الإستحقاقات</th><th class="nowrap-cell" colspan="2" style="background:#b71c1c;color:#fff;border:1px solid #000;padding:6px;white-space:nowrap">المستقطع</th></tr><tr style="background:#e8f5e9"><th class="nowrap-cell" style="border:1px solid #000;padding:5px;color:#000;white-space:nowrap">المبلغ</th><th class="nowrap-cell" style="border:1px solid #000;padding:5px;color:#000;white-space:nowrap">البيان</th><th class="nowrap-cell" style="border:1px solid #000;padding:5px;color:#000;white-space:nowrap">المبلغ</th><th class="nowrap-cell" style="border:1px solid #000;padding:5px;color:#000;white-space:nowrap">البيانات</th></tr></thead>'
    + '<tbody style="background:#fff;color:#000">'+table_rows_html+'</tbody>'
    + '</table>'
    + '</td></tr></table>'
    + '<div style="margin-top:12px; text-align:center; background:linear-gradient(180deg,#ffffff,#fefcf6); border:2px solid #000; border-radius:12px; padding:12px; box-shadow: 0 5px 0 #d2b48c, 0 3px 0 #000;">'
    + '<div style="font-size:13px; font-weight:800; color:#000;">إعداد وتطوير</div>'
    + '<div style="font-size:16px; font-weight:900; color:#b71c1c; margin-top:4px;">أ/ مصطفى درويش سيد درويش</div>'
    + '<div style="font-size:13px; font-weight:800; color:#000; margin-top:6px;">رقم الهاتف : <span dir="ltr" style="font-family:monospace; font-weight:900;">01092259655</span></div>'
    + '</div>'
    + '</div>';
}

function isRedItem(label){
  const redKeywords = ["علاج طبى", "علاج طبي", "ضريبه", "ضريبة", "جمعيه الخدمات الاجتماعية", "جمعية الخدمات الاجتماعية", "قسط صندوق انتماء", "قسط صندوق الانتماء"];
  const lower = String(label).replace(/[ىي]/g, "ي").trim();
  return redKeywords.some(k => lower.includes(k.replace(/[ىي]/g, "ي")) || String(label).includes(k));
}

async function executeSearch(){
  const code = getEmpCodeFromHeader();
  const loader = document.getElementById('loader');
  const displayArea = document.getElementById('displayArea');

  if(!code){
    alert('لم يتم العثور على كود الموظف في الهيدر - تأكد من تسجيل الدخول');
    return;
  }

  const codeBadge = document.getElementById('headerCode');
  if(codeBadge){
    codeBadge.textContent = "الكود: " + toArabicDigits(code);
  }

  startLoadCounter();
  if(displayArea) displayArea.style.display = "none";

  try{
    const monthArabic = monthNameMap[currentMonth] || String(currentMonth);
    const yearStr = String(currentYear);
    const url = WORKER_BASE_URL + "/api/salary-turso?year=" + encodeURIComponent(yearStr) + "&month=" + encodeURIComponent(monthArabic) + "&code=" + encodeURIComponent(code);
    
    const res = await fetch(url);
    const j = await res.json();
    
    stopLoadCounter();

    // إصلاح Bug يناير/سبتمبر: التأكد أن البيانات الراجعة هي لنفس الشهر المطلوب
    // لو API رجع يناير وانت طالب سبتمبر، نعتبره غير موجود
    let dataMonth = j.data ? (j.data["الشهر"] || "") : "";
    let dataYear = j.data ? String(j.data["السنه"] || "") : "";
    
    // تنظيف للمقارنة
    const requestedMonth = monthArabic.trim();
    const requestedYear = yearStr.trim();
    const returnedMonth = String(dataMonth).trim();
    const returnedYear = String(dataYear).trim();
    
    const isMonthMismatch = returnedMonth && requestedMonth && returnedMonth !== requestedMonth;
    const isYearMismatch = returnedYear && requestedYear && returnedYear !== requestedYear;
    
    // لو الشهر أو السنة مختلفة، نعتبرها غير موجودة
    if(!res.ok || !j.found || !j.data || isMonthMismatch || isYearMismatch){
      const area = document.getElementById('displayArea');
      const printArea = document.getElementById('printArea');
      if(area) area.style.display='block';
      if(printArea){
        printArea.innerHTML = `
          <div style="
            background:linear-gradient(180deg,#ffffff 0%,#fefcf6 50%,#f5e6c8 100%);
            border:3px solid #000;
            border-radius:18px;
            padding:32px 20px;
            text-align:center;
            box-shadow: 0 10px 0 #d2b48c, 0 8px 0 #000, 0 20px 30px rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.9);
            transform: perspective(800px) rotateX(2deg);
            position:relative;
          ">
            <div style="
              font-size:26px;
              font-weight:900;
              color:#b71c1c;
              text-shadow: 0 2px 0 #fff, 0 4px 0 #d2b48c, 0 6px 8px rgba(0,0,0,0.3);
              margin-bottom:18px;
              line-height:1.4;
              white-space:pre-line;
            ">لا يوجد بيانات لهذا الشهر
الرجاء الإتصال بمطور الخدمة للإستعلام</div>
            <div style="
              font-size:16px;
              font-weight:800;
              color:#000;
              line-height:2.2;
              background:#fff;
              border:2px solid #000;
              border-radius:12px;
              padding:16px;
              box-shadow: 0 4px 0 #d2b48c, 0 2px 0 #000;
              display:inline-block;
              min-width:300px;
            ">
              <span style="font-size:19px; color:#b71c1c; font-weight:900;">أ/ مصطفى درويش سيد درويش</span><br><br>
              <span style="background:#fffde7; border:1.5px solid #000; border-radius:8px; padding:6px 12px; display:inline-block; margin:5px; font-size:14px; white-space:nowrap;">
                رقم الهاتف / <span dir="ltr" style="font-family:monospace; font-weight:900;">01092259655</span>
              </span><br>
              <span style="background:#e8f5e9; border:1.5px solid #000; border-radius:8px; padding:6px 12px; display:inline-block; margin:5px; font-size:14px; white-space:nowrap;">
                رقم الواتس أب / <span dir="ltr" style="font-family:monospace; font-weight:900;">01092259655</span>
              </span>
            </div>
            <div style="font-size:11px; color:#7a6652; margin-top:14px; font-weight:700;">
              ${toArabicDigits(yearStr)} - ${monthArabic} - ${toArabicDigits(code)}
            </div>
          </div>
        `;
      }
      return;
    }

    renderForm(j.data);

  }catch(err){
    stopLoadCounter();
    console.error(err);
    const area = document.getElementById('displayArea');
    const printArea = document.getElementById('printArea');
    if(area) area.style.display='block';
    if(printArea){
      printArea.innerHTML = `
        <div style="background:linear-gradient(180deg,#ffffff 0%,#fefcf6 50%,#f5e6c8 100%); border:3px solid #000; border-radius:18px; padding:32px 20px; text-align:center; box-shadow: 0 10px 0 #d2b48c, 0 8px 0 #000, 0 20px 30px rgba(0,0,0,0.2);">
          <div style="font-size:22px; font-weight:900; color:#b71c1c; text-shadow: 0 2px 0 #fff, 0 4px 0 #d2b48c, 0 6px 8px rgba(0,0,0,0.3); margin-bottom:14px;">لا يوجد بيانات لهذا الشهر<br>الرجاء الإتصال بمطور الخدمة للإستعلام</div>
          <div style="font-size:15px; font-weight:800; background:#fff; border:2px solid #000; border-radius:12px; padding:14px; display:inline-block;">
            <span style="color:#b71c1c; font-size:18px;">أ/ مصطفى درويش سيد درويش</span><br>
            رقم الهاتف / 01092259655<br>رقم الواتس أب / 01092259655
          </div>
        </div>`;
    }
  }
}

function renderForm(row){
  lastData = row;
  const area = document.getElementById('displayArea');
  const printArea = document.getElementById('printArea');
  if(!area || !printArea) return;
  area.style.display='block';

  let allKeys = Object.keys(row);
  let startIdx = allKeys.findIndex(k => k.includes("مرتب_اساسي") || k.includes("مرتب اساسي"));
  let midIdx = allKeys.findIndex(k => k.includes("أجمالى_المستحق") || k.includes("اجمالى_المستحق") || k.includes("اجمالي_المستحق") || k.includes("إجمالى_المستحق"));
  let endIdx = allKeys.findIndex(k => k.includes("الصافى") || k.includes("الصافي"));

  let instKeys, mustKeys, safyKey;
  if(startIdx!==-1 && midIdx!==-1){
    instKeys = allKeys.slice(startIdx, midIdx+1);
    if(endIdx!==-1){ mustKeys = allKeys.slice(midIdx+1, endIdx); safyKey = allKeys[endIdx]; }
    else mustKeys = allKeys.slice(midIdx+1);
  } else {
    const meta = ["السنه","الشهر","كود_العامل","الاسم","emptid","id","م","اسم_البنك_المحول_و_الفرع_المحول_اليه","رقم_الحساب_البنكى","كود_البنك","كود_القسم","البنك","الكود_البنكى","اسم_العامل"];
    let filtered = allKeys.filter(k=>!meta.includes(k) && row[k]!=null && row[k]!="" && !isNaN(parseFloat(row[k])));
    let mid = filtered.findIndex(k=>k.includes("المستحق") || k.includes("الاستحقاق"));
    if(mid!==-1){ instKeys=filtered.slice(0,mid+1); mustKeys=filtered.slice(mid+1); }
    else { instKeys=filtered.slice(0, Math.ceil(filtered.length/2)); mustKeys=filtered.slice(Math.ceil(filtered.length/2)); }
    let sIdx = filtered.findIndex(k=>k.includes("الصافى")||k.includes("الصافي"));
    if(sIdx!==-1){ safyKey=filtered[sIdx]; mustKeys=mustKeys.filter(k=>k!==safyKey); }
  }

  let inst=[], must=[];
  (instKeys||[]).forEach(k=>{
    let v=row[k];
    if(v!==null && v!=="" && !isNaN(parseFloat(v)) && parseFloat(v)!=0){
      inst.push({key: k.replace(/_/g," "), val: parseFloat(v).toFixed(2)});
    }
  });
  (mustKeys||[]).forEach(k=>{
    let v=row[k];
    if(v!==null && v!=="" && !isNaN(parseFloat(v)) && parseFloat(v)!=0){
      must.push({key: k.replace(/_/g," "), val: parseFloat(v).toFixed(2)});
    }
  });

  const max = Math.max(inst.length, must.length);
  let rowsHtml="";
  for(let i=0;i<max;i++){
    const a=inst[i]||{key:"",val:""};
    const b=must[i]||{key:"",val:""};
    const aRed = isRedItem(a.key);
    const bRed = isRedItem(b.key);
    rowsHtml+='<tr style="height:28px">'
      +'<td class="nowrap-cell" style="border:1px solid #000;padding:4px 3px;text-align:center;font-size:14px;white-space:nowrap;'+(aRed?'color:#b71c1c;font-weight:900;background:#fff1f1;':'color:#000')+'">'+(a.val?toArabicDigits(a.val):"")+'</td>'
      +'<td class="nowrap-cell" style="border:1px solid #000;padding:4px 6px;text-align:right;font-size:14px;white-space:nowrap;'+(aRed?'color:#b71c1c;font-weight:900;background:#fff1f1;':'color:#000')+'">'+a.key+'</td>'
      +'<td class="nowrap-cell" style="border:1px solid #000;padding:4px 3px;text-align:center;font-size:14px;white-space:nowrap;'+(bRed?'color:#b71c1c;font-weight:900;background:#fff1f1;':'color:#000')+'">'+(b.val?toArabicDigits(b.val):"")+'</td>'
      +'<td class="nowrap-cell" style="border:1px solid #000;padding:4px 6px;text-align:right;font-size:14px;white-space:nowrap;'+(bRed?'color:#b71c1c;font-weight:900;background:#fff1f1;':'color:#000')+'">'+b.key+'</td>'
      +'</tr>';
  }

  let safyVal = safyKey ? row[safyKey] : (row["الصافى"] || row["الصافي"] || row["الصافي_النهائي"]);
  if(safyVal){
    rowsHtml+='<tr><td colspan="2" class="nowrap-cell" style="border:2px solid #000;padding:6px;text-align:center;font-weight:900;background:#fff9c4;color:#000;white-space:nowrap">الصافي</td><td colspan="2" class="nowrap-cell" style="border:2px solid #000;padding:6px;text-align:center;font-weight:900;background:#fff176;color:#b71c1c;font-size:16px;white-space:nowrap">'+toArabicDigits(parseFloat(safyVal).toFixed(2))+'</td></tr>';
  }

  const empName = row["الاسم"] || row["اسم_العامل"] || getEmpNameFromHeader() || "";
  const empCode = row["emptid"] || row["كود_العامل"] || row["الكود_البنكى"] || getEmpCodeFromHeader() || "";
  const finYear = row["السنه"] || currentYear;
  const monVal = row["الشهر"] || monthNameMap[currentMonth];
  const bankName = row["اسم_البنك_المحول_و_الفرع_المحول_اليه"] || row["اسم_البنك_المحول_والفرع_المحول_الية"] || "";
  const bankCode = row["رقم_الحساب_البنكى"] || row["كود_البنك"] || "";

  printArea.innerHTML = getFormHtmlJS(empName, empCode, finYear, monVal, bankName, bankCode, rowsHtml, 14);
}

async function downloadImage(){
  const area = document.getElementById('printArea');
  if(!area) return;
  try{
    const canvas = await html2canvas(area, { scale:2, backgroundColor:"#ffffff", useCORS:true });
    const link = document.createElement('a');
    link.download = 'مرتب-'+currentYear+'-'+currentMonth+'-'+getEmpCodeFromHeader()+'.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(e){
    alert('تعذر تحميل الصورة: ' + e.message);
  }
}

window.onload = function(){
  try{
    const u = JSON.parse(localStorage.getItem('logged_user')||'{}');
    const nameEl = document.getElementById('userName');
    if(nameEl) nameEl.textContent = 'مرحبا ' + (u.name || getEmpNameFromHeader() || 'User');
    const codeBadge = document.getElementById('headerCode');
    const code = getEmpCodeFromHeader();
    if(codeBadge) codeBadge.textContent = 'الكود: ' + (code ? toArabicDigits(code) : '--');
  }catch(e){}

  const now = new Date();
  currentMonth = now.getMonth() + 1;
  currentYear = now.getFullYear();
  updateMonthLabels();
  executeSearch();
};
</script>
