<style>
*{font-family:'Cairo',sans-serif; box-sizing:border-box}
body{
  background:#fdf6e3;
  background-image: radial-gradient(900px 500px at 50% 0%, rgba(210,180,140,0.25), transparent 70%), linear-gradient(180deg,#fdf6e3,#f5f5dc);
  min-height:100vh;
  color:#1a1a1a;
  margin:0;
  padding:16px;
}
.card{
  background:linear-gradient(180deg,#ffffff 0%,#fefcf6 15%,#f5e6c8 100%);
  border:2px solid #000;
  border-radius:18px;
  box-shadow: 0 8px 0 #d2b48c, 0 4px 0 #000, 0 12px 24px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.9);
  position:relative;
}
.top-strip{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  gap:12px;
  flex-wrap:wrap;
}
.top-strip h1{
  font-size:18px;
  font-weight:800;
  margin:0;
  color:#000;
  line-height:1.2;
}
.top-strip p{
  font-size:11px;
  color:#7a6652;
  margin:2px 0 0 0;
}
.code-badge{
  display:inline-flex;
  align-items:center;
  background:#fff;
  border:2px solid #000;
  border-radius:999px;
  padding:4px 12px;
  font-size:12px;
  font-weight:800;
  color:#000;
  box-shadow: 0 3px 0 #d2b48c, 0 2px 0 #000;
}
.btn-3d{
  height:40px;
  padding:0 14px;
  border-radius:12px;
  border:2px solid #000;
  font-weight:800;
  font-size:12px;
  cursor:pointer;
  transition:.1s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
}
.btn-logout{
  background:#fff1f1;
  color:#b91c1c;
  box-shadow: 0 4px 0 #e8a0a0, 0 2px 0 #000;
}
.btn-logout:active{ transform:translateY(3px); box-shadow: 0 1px 0 #e8a0a0, 0 1px 0 #000; }
.btn-nav{
  background:linear-gradient(180deg,#ffffff,#f5e6c8);
  color:#000;
  box-shadow: 0 5px 0 #d2b48c, 0 3px 0 #000;
  min-width:88px;
}
.btn-nav:active{ transform:translateY(3px); box-shadow: 0 2px 0 #d2b48c, 0 1px 0 #000; }
.btn-main{
  background:linear-gradient(180deg,#ffefc3,#f0c98a);
  color:#000;
  box-shadow: 0 5px 0 #c19a6b, 0 3px 0 #000;
}
.btn-main:active{ transform:translateY(3px); box-shadow: 0 2px 0 #c19a6b, 0 1px 0 #000; }
.nav-strip{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
  margin-top:14px;
  gap:10px;
}
.month-center{
  text-align:center;
  flex:1;
}
.month-center .label-month{
  font-size:20px;
  font-weight:800;
  color:#000;
}
.month-center .label-year{
  font-size:12px;
  color:#7a6652;
  font-weight:700;
}
.loader{
  margin-top:16px;
  padding:18px;
  text-align:center;
  font-weight:700;
  color:#7a6652;
  display:none;
}
.displayArea{
  margin-top:16px;
}
.printArea{
  background:#fff;
  border:2px solid #000;
  border-radius:14px;
  padding:14px;
  overflow:hidden;
}
.company-header{
  text-align:center;
  padding:6px 0 10px;
  border-bottom:2px dashed #d2b48c;
  margin-bottom:12px;
}
.company-header h2{ font-size:15px; font-weight:800; margin:0; color:#000; }
.company-header p{ font-size:11px; color:#7a6652; margin:2px 0 0 0; }
.info-table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:12px;
  font-size:12px;
}
.info-table td{
  border:1.5px solid #000;
  padding:6px 8px;
  font-weight:600;
}
.info-table td:first-child{
  background:#fdf6e3;
  font-weight:800;
  width:22%;
}
.salary-table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}
.salary-table th{
  background:linear-gradient(180deg,#fff,#f5e6c8);
  border:1.5px solid #000;
  padding:8px 6px;
  font-weight:800;
  font-size:13px;
  text-align:center;
}
.salary-table td{
  border:1.5px solid #000;
  padding:7px 8px;
  font-weight:600;
}
.salary-table tr:nth-child(even) td{ background:#fdf6e3; }
.net-row td{
  background:linear-gradient(180deg,#ffefc3,#f0c98a) !important;
  font-weight:800;
  font-size:13px;
  color:#000;
}
.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
  justify-content:center;
}
.empty-msg{
  text-align:center;
  padding:22px 10px;
  color:#7a6652;
  font-weight:700;
}
</style>

<script>
const WORKER_BASE_URL = "https://turso-api.mostafa-voic77729.workers.dev";

  1:"يناير", 2:"فبراير", 3:"مارس", 4:"أبريل", 5:"مايو", 6:"يونيو",
  7:"يوليو", 8:"أغسطس", 9:"سبتمبر", 10:"أكتوبر", 11:"نوفمبر", 12:"ديسمبر"
};

let currentMonth = new Date().getMonth() + 1;
let currentYear = new Date().getFullYear();

function toArabicDigits(str){
  const map = {'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
  return String(str).replace(/[0-9]/g, d => map[d]);
}

function getEmpCodeFromHeader(){
  try{
    const v1 = localStorage.getItem('empCode');
    if(v1) return v1.trim();
    const v2 = localStorage.getItem('emptid');
    if(v2) return v2.trim();
    const logged = JSON.parse(localStorage.getItem('logged_user')||'{}');
    if(logged.code) return String(logged.code).trim();
    if(logged.emptid) return String(logged.emptid).trim();
    if(logged.id) return String(logged.id).trim();
  }catch(e){}
  const el = document.getElementById('headerCode');
  if(el){
    const txt = el.textContent||"";
    const m = txt.match(/[0-9A-Za-z]+/);
    if(m && m[0] !== "--") return m[0];
  }
  return "";
}

function getEmpNameFromHeader(){
  try{
    const logged = JSON.parse(localStorage.getItem('logged_user')||'{}');
    if(logged.name) return logged.name;
  }catch(e){}
  return "User";
}

function changeMonth(delta){
  currentMonth += delta;
  if(currentMonth > 12){ currentMonth = 1; currentYear++; }
  if(currentMonth < 1){ currentMonth = 12; currentYear--; }
  updateMonthLabels();
  executeSearch();
}

function updateMonthLabels(){
  const mEl = document.getElementById('currentMonthLabel');
  const yEl = document.getElementById('currentYearLabel');
  if(mEl) mEl.textContent = monthNameMap[currentMonth] || currentMonth;
  if(yEl) yEl.textContent = toArabicDigits(String(currentYear));
}

function mockSalaryData(code, name){
  const baseEarn = [
    {label:"الراتب الأساسي", value:8500},
    {label:"بدل سكن", value:2125},
    {label:"بدل نقل", value:800},
    {label:"بدل طبيعة عمل", value:1200},
    {label:"مكافأة", value:500},
  ];
  const baseDed = [
    {label:"التأمينات الاجتماعية", value:765},
    {label:"ضريبة", value:0},
    {label:"سلفة", value:0},
    {label:"خصميات", value:0},
  ];
  const totE = baseEarn.reduce((s,x)=>s+x.value,0);
  const totD = baseDed.reduce((s,x)=>s+x.value,0);
  return {
    code: code || "12345",
    name: name || "الموظف",
    bank: "البنك الأهلي - **** 1234",
    month: currentMonth,
    year: currentYear,
    earnings: baseEarn,
    deductions: baseDed,
    totalEarnings: totE,
    totalDeductions: totD,
    net: totE - totD
  };
}

async function executeSearch(){
  const code = getEmpCodeFromHeader();
  const nameFromHeader = getEmpNameFromHeader();
  const loader = document.getElementById('loader');
  const displayArea = document.getElementById('displayArea');

  if(loader) loader.style.display = "block";
  if(displayArea) displayArea.style.display = "none";

  // Update header code badge if we have code
  const codeBadge = document.getElementById('headerCode');
  if(codeBadge){
    codeBadge.textContent = "الكود: " + (code ? toArabicDigits(code) : "--");
  }

  try{
    // Try real API - multiple possible endpoints
    let data = null;
    const token = localStorage.getItem('secure_token') || "";
    const headers = token ? { 'Authorization': 'Bearer ' + token } : {};

    const urls = [
      `${WORKER_BASE_URL}/api/salary?code=${encodeURIComponent(code)}&month=${currentMonth}&year=${currentYear}`,
      `${WORKER_BASE_URL}/api/turso?code=${encodeURIComponent(code)}&month=${currentMonth}&year=${currentYear}`,
      `${WORKER_BASE_URL}/api/salary/${encodeURIComponent(code)}/${currentYear}/${currentMonth}`
    ];

    for(let u of urls){
      try{
        const res = await fetch(u, { headers });
        if(res.ok){
          const j = await res.json();
          // normalize if API returns wrapped object
          if(j && (j.earnings || j.data || j.salary)){
            data = j.data || j.salary || j;
            // if API returns different shape, keep as is and let render handle fallback
            if(data && data.code) break;
          }
          if(j && j.ok && j.rows) { /* turso rows */ }
        }
      }catch(_){}
    }

    if(!data || !data.earnings){
      data = mockSalaryData(code, nameFromHeader);
    }

    renderForm(data);

  }catch(err){
    console.error(err);
    const fallback = mockSalaryData(code, nameFromHeader);
    renderForm(fallback);
  }finally{
    if(loader) loader.style.display = "none";
    if(displayArea) displayArea.style.display = "block";
  }
}

function renderForm(d){
  const printArea = document.getElementById('printArea');
  if(!printArea) return;

  const earnings = d.earnings || [];
  const deductions = d.deductions || [];
  const maxRows = Math.max(earnings.length, deductions.length);

  const totalE = d.totalEarnings ?? earnings.reduce((s,x)=>s+(x.value||0),0);
  const totalD = d.totalDeductions ?? deductions.reduce((s,x)=>s+(x.value||0),0);
  const net = d.net ?? (totalE - totalD);

  let rowsHtml = "";
  for(let i=0;i<maxRows;i++){
    const e = earnings[i];
    const dc = deductions[i];
    rowsHtml += `<tr>
      <td>${e ? e.label : ""}</td>
      <td style="text-align:center">${e ? toArabicDigits(e.value.toLocaleString('en-US')) : ""}</td>
      <td>${dc ? dc.label : ""}</td>
      <td style="text-align:center">${dc ? toArabicDigits(dc.value.toLocaleString('en-US')) : ""}</td>
    </tr>`;
  }

  printArea.innerHTML = `
    <div class="company-header">
      <h2>بيان مفردات المرتب</h2>
      <p>نظام شؤون العاملين - إدارة الرواتب</p>
    </div>

    <table class="info-table">
      <tr>
        <td>السنة</td><td>${toArabicDigits(d.year)}</td>
        <td>الشهر</td><td>${monthNameMap[d.month] || d.month}</td>
      </tr>
      <tr>
        <td>كود الموظف</td><td>${toArabicDigits(d.code)}</td>
        <td>اسم الموظف</td><td>${d.name}</td>
      </tr>
      <tr>
        <td>البنك</td><td colspan="3">${d.bank || "--"}</td>
      </tr>
    </table>

    <table class="salary-table">
      <thead>
        <tr>
          <th colspan="2">الاستحقاقات</th>
          <th colspan="2">الاستقطاعات</th>
        </tr>
        <tr>
          <th>البيان</th><th>المبلغ</th>
          <th>البيان</th><th>المبلغ</th>
        </tr>
      </thead>
      <tbody>
        ${rowsHtml}
        <tr class="net-row">
          <td>إجمالي الاستحقاقات</td><td style="text-align:center">${toArabicDigits(totalE.toLocaleString('en-US'))}</td>
          <td>إجمالي الاستقطاعات</td><td style="text-align:center">${toArabicDigits(totalD.toLocaleString('en-US'))}</td>
        </tr>
        <tr class="net-row">
          <td colspan="2" style="text-align:center">الصافي</td>
          <td colspan="2" style="text-align:center">${toArabicDigits(net.toLocaleString('en-US'))} جنيه</td>
        </tr>
      </tbody>
    </table>
  `;
}

function getFormHtmlJS(){
  const el = document.getElementById('printArea');
  return el ? el.innerHTML : "";
}

async function downloadImage(){
  const area = document.getElementById('printArea');
  if(!area) return;
  try{
    const canvas = await html2canvas(area, { scale:2, backgroundColor:"#ffffff", useCORS:true });
    const link = document.createElement('a');
    link.download = 'salary-' + currentYear + '-' + currentMonth + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(e){
    alert('تعذر تحميل الصورة: ' + e.message);
  }
}

window.onload = function(){
  try{
    const u = JSON.parse(localStorage.getItem('logged_user')||'{}');
    const nameEl = document.getElementById('userName');
    if(nameEl) nameEl.textContent = 'مرحبا ' + (u.name || 'User');
    const codeBadge = document.getElementById('headerCode');
    const code = getEmpCodeFromHeader();
    if(codeBadge) codeBadge.textContent = 'الكود: ' + (code ? toArabicDigits(code) : '--');
  }catch(e){}

  const now = new Date();
  currentMonth = now.getMonth() + 1;
  currentYear = now.getFullYear();
  updateMonthLabels();
  executeSearch();
};
