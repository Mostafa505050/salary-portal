<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مراقبة - IP حقيقي</title>
<style>
body{margin:0;background:#f0f9ff;padding:12px;font-family:Cairo,sans-serif}
.box{max-width:1200px;margin:0 auto 12px;background:#fff;border-radius:14px;padding:14px}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:#0ea5e9;color:#fff;padding:8px}
td{padding:6px;border-bottom:1px solid #eee;text-align:center}
.ip{font-weight:800;color:#dc2626;background:#fee2e2;padding:2px 6px;border-radius:6px}
.btn{padding:5px 8px;border-radius:6px;border:none;font-weight:700;cursor:pointer;font-size:10px}
.btn-block{background:#ef4444;color:#fff}
.btn-unblock{background:#10b981;color:#fff}
</style>
</head>
<body>
<div class="box" style="text-align:center">
<h2>📊 مراقبة حقيقية - IP إجباري</h2>
<div>IP الخاص بك: <span id="myIp" class="ip">جاري...</span></div>
</div>
<div class="box">
<h3>الأجهزة التي دخلت</h3>
<table><thead><tr><th>التاريخ</th><th>الصفحة</th><th>الجهاز</th><th>IP حقيقي</th><th>حظر</th></tr></thead><tbody id="realTable"><tr><td colspan=5>⏳</td></tr></tbody></table>
</div>
<div class="box">
<h3>🚫 الأجهزة المحظورة - إصلاح مشكلة التحميل</h3>
<table><thead><tr><th>IP</th><th>الجهاز</th><th>السبب</th><th>التاريخ</th><th>فك</th></tr></thead><tbody id="blockedTable"><tr><td colspan=5>⏳ جاري تحميل المحظورين...</td></tr></tbody></table>
<div id="debug" style="background:#1e293b;color:#6ee7b7;padding:8px;border-radius:6px;font-size:10px;white-space:pre-wrap;margin-top:8px"></div>
</div>
<script src="/js/real-logger.js"></script>
<script>
const API='/api/turso';
const IP_API='/api/get-ip';
async function getIp(){
  try{
    const res=await fetch(IP_API);
    const data=await res.json();
    document.getElementById('myIp').innerText=data.ip;
  }catch(e){
    document.getElementById('myIp').innerText=localStorage.getItem('user_real_ip')||'unknown';
  }
}
async function loadReal(){
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql:'SELECT * FROM real_page_logs ORDER BY created_at DESC LIMIT 100'})});
    const data=await res.json();
    const rows=data.rows||JSON.parse(localStorage.getItem('real_page_logs')||'[]');
    const tbody=document.getElementById('realTable');
    tbody.innerHTML='';
    rows.slice(-30).reverse().forEach(r=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${r.created_at||''}</td><td>${r.page||''}</td><td>${r.device_model||''}</td><td><span class="ip">${r.ip||''}</span></td><td><button class="btn btn-block" onclick="blockDevice('${r.ip}','${r.device_model}')">حظر</button></td>`;
      tbody.appendChild(tr);
    });
  }catch{}
  loadBlocked();
}
async function loadBlocked(){
  const tbody=document.getElementById('blockedTable');
  const debug=document.getElementById('debug');
  debug.textContent='جلب blocked_devices...\n';
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql:'SELECT * FROM blocked_devices ORDER BY created_at DESC LIMIT 50'})});
    const txt=await res.text();
    debug.textContent+='Response: '+txt.slice(0,400)+'\n';
    let data; try{ data=JSON.parse(txt); }catch{ data={rows:[]}; }
    const rows=data.rows||[];
    tbody.innerHTML='';
    if(rows.length===0){
      tbody.innerHTML='<tr><td colspan=5>لا يوجد محظورين - الجدول فارغ</td></tr>';
      debug.textContent+='الجدول فارغ\n';
      return;
    }
    rows.forEach(r=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td><span class="ip">${r.ip||''}</span></td><td>${r.device_model||''}</td><td>${r.reason||''}</td><td>${r.created_at||''}</td><td><button class="btn btn-unblock" onclick="unblock(${r.id})">فك</button></td>`;
      tbody.appendChild(tr);
    });
  }catch(e){
    debug.textContent+='Error: '+e.message+'\n';
    tbody.innerHTML='<tr><td colspan=5>فشل - تأكد Worker يحتوي /api/turso</td></tr>';
  }
}
window.blockDevice=async function(ip,device){
  if(!ip || ip==='local' || ip==='manual' || !ip.includes('.')){ alert('IP غير حقيقي: '+ip); return; }
  if(!confirm('حظر '+ip+'؟')) return;
  await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql:'INSERT INTO blocked_devices (device_model,ip,reason,created_at) VALUES (?,?,?,datetime("now","localtime"))',params:[device,ip,'محظور']})});
  loadBlocked();
}
window.unblock=async function(id){
  if(!confirm('فك حظر '+id+'؟')) return;
  await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql:'DELETE FROM blocked_devices WHERE id=?',params:[id]})});
  loadBlocked();
}
getIp();
loadReal();
</script>
</body>
</html>
