<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مفردات المرتب</title>
<style>
*{box-sizing:border-box}body{font-family:'Cairo',Tahoma;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}
.card{max-width:600px;margin:40px auto;background:#1e293b;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:18px;text-align:center}
button{width:100%;margin-top:12px;padding:14px;border:none;border-radius:10px;background:#22c55e;color:#000;font-weight:800;font-size:18px;cursor:pointer}
.result{margin-top:20px;background:#0f172a;border-radius:12px;padding:16px;display:none}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #334155}
.net{background:#22c55e;color:#000;border-radius:10px;padding:12px;text-align:center;font-size:22px;font-weight:900;margin-top:12px}
</style></head>
<body>
<div class="card">
<h2 style="text-align:center">مفردات المرتب - أغسطس 2026</h2>
<input id="cardInput" placeholder="أدخل الرقم القومي 14 رقم" maxlength="14">
<button onclick="عرض()">عرض مفردات المرتب</button>
<div id="result" class="result"></div>
<p style="text-align:center;color:#94a3b8;font-size:12px;margin-top:16px">مربوط بـ Google Sheet + Turso-Api</p>
</div>
<script>
const API = "https://hafez-api.mostafa-voic77729.workers.dev";
async function عرض(){
  const card = document.getElementById('cardInput').value.trim();
  if(card.length!=14) return alert('الرقم القومي 14 رقم');
  const btn = document.querySelector('button'); btn.textContent='جاري البحث...'; btn.disabled=true;
  try{
    const res = await fetch(API+'/api/salary/by-card',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cardNumber:card})});
    const data = await res.json();
    if(!data.ok) throw new Error(data.msg);
    const emp = data.employee; const sal = data.salary;
    document.getElementById('result').style.display='block';
    document.getElementById('result').innerHTML=`
      <div class="row"><span>الاسم:</span><span>${emp.name}</span></div>
      <div class="row"><span>الكود:</span><span>${emp.code}</span></div>
      <div class="row"><span>الرقم القومي:</span><span>${emp.national}</span></div>
      <div class="row"><span>الشهر:</span><span>${data.month} / ${data.year}</span></div>
      <div class="row"><span>الأساسي:</span><span>${sal?.الأساسي||sal?.basic||'-'}</span></div>
      <div class="row"><span>الحافز:</span><span>${sal?.الحافز||sal?.hafez||'-'}</span></div>
      <div class="net">الصافي: ${sal?.الصافي||sal?.net||sal?.صافي||'غير مسجل بعد - يتم الصرف يوم 13 أغسطس'}</div>
    `;
  }catch(e){ alert(e.message); }
  btn.textContent='عرض مفردات المرتب'; btn.disabled=false;
}
</script>
</body></html>
